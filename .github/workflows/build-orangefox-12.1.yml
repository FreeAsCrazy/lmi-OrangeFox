name: 编译 OrangeFox Recovery 12.1 (lmi)

# 手动触发构建橙狐 Recovery（设备：Xiaomi lmi / POCO F2 Pro）
# 工作流中的加固手法参考 FreeAsCrazy/lmi-recovery 的 build-lmi-recovery.yml
on:
  workflow_dispatch:
    inputs:
      fox_branch:
        description: "OrangeFox 源码分支"
        required: false
        default: "12.1"
      build_target:
        description: "lunch 目标"
        required: false
        default: "twrp_lmi-eng"

permissions:
  contents: read

# 同仓库同一时刻只跑一个构建，新触发排队而不打断进行中的编译
concurrency:
  group: orangefox-build-12
  cancel-in-progress: false

env:
  FOX_BRANCH: ${{ github.event.inputs.fox_branch || '12.1' }}
  BUILD_TARGET: ${{ github.event.inputs.build_target || 'twrp_lmi-eng' }}
  FOX_DIR: /home/runner/fox_12.1
  # ---- AOSP 构建环境调优 ----
  ALLOW_MISSING_DEPENDENCIES: "true"  # recovery 构建允许缺失的非必需依赖（测试套件等）
  GOMEMLIMIT: 12GiB                   # 压住 soong(Go) 分析 Android.bp 的内存峰值
  LC_ALL: C                           # 统一排序/工具链输出，避免 locale 差异

jobs:
  build:
    name: 同步源码 & 编译镜像
    # 固定 24.04：ubuntu-latest 会随时间滚动；22.04 已进入退役倒计时（2027-04）
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出设备树
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          echo "=== 清理预装工具链以腾出空间 ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean >/dev/null 2>&1 || true
          df -h /

      - name: 添加 swap
        run: |
          # 7G 物理内存 + 24G swap：lunch/kati 阶段内存峰值高，参考上游的 24G 配置
          sudo swapoff -a 2>/dev/null || true
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          free -h
          df -h /

      - name: 安装编译依赖
        run: |
          set -euo pipefail
          PKGS="bc bison build-essential ccache flex gperf imagemagick liblz4-tool \
                 libncurses-dev libssl-dev lzop pngcrush rsync schedtool zip zlib1g-dev"
          # apt 索引过期/网络抖动时 install 会失败：update 后重试一次
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $PKGS || {
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $PKGS
          }
          # noble 移除了 libncurses5/libtinfo5，部分 AOSP prebuilt clang 仍链 libtinfo.so.5；
          # 从 focal 池补装（best-effort，404 或冲突都不阻断构建）
          N=6.2-0ubuntu2.1
          for P in libtinfo5 libncurses5; do
            curl -fsSL --retry 3 -O "http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/${P}_${N}_amd64.deb" || continue
            sudo dpkg -i "${P}_${N}_amd64.deb" || true
            rm -f "${P}_${N}_amd64.deb"
          done
          df -h /

      - name: 安装 repo 工具
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          # repo 的部分操作会读取 git 身份，先配好避免探测失败
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          "$HOME/bin/repo" --version || true

      - name: 选择 JDK 11
        run: |
          set -euo pipefail
          # AOSP 12.1 需要 JDK 11（runner 默认 17），优先用镜像自带的 11 号 JDK
          if [ -n "${JAVA_HOME_11_X64:-}" ] && [ -d "$JAVA_HOME_11_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_11_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_11_X64/bin" >> "$GITHUB_PATH"
          fi
          java -version 2>&1 || true

      - name: 同步 OrangeFox 源码
        run: |
          set -euo pipefail
          SYNC_START=$(date +%s)
          SYNC_DIR="$HOME/OrangeFox_sync/sync"
          if [ ! -d "$SYNC_DIR/.git" ]; then
            mkdir -p "$HOME/OrangeFox_sync"
            git clone --depth 1 https://gitlab.com/OrangeFox/sync.git "$SYNC_DIR"
          fi
          cd "$SYNC_DIR"
          chmod +x orangefox_sync.sh

          # orangefox_sync.sh 内部写的是 `repo sync ... -j$(nproc --all)`，
          # GitHub runner 只有 4 核 → 等于 -j4，拉几十 GB 完全是串行的。
          # 拉源码是网络密集型，和 CPU 核数无关，提到 -j32 才能吃满带宽；
          # 顺带补上 --retry-fetches（脚本自己没带，弱网下会整轮失败）。
          sed -i -e 's/-j\$(nproc --all)/-j32/g' \
                 -e 's/repo sync -c -j4/repo sync -c -j32/g' \
                 -e 's/--no-tags "\$@"/--no-tags --retry-fetches=5 "$@"/' \
                 orangefox_sync.sh
          echo "=== 打补丁后的 sync 命令 ==="
          grep -n 'repo sync' orangefox_sync.sh

          # ---- 在 repo init 与 repo sync 之间插入「按前缀剔除无关项目」 ----
          # 12.1 用的是 TWRP 的 minimal manifest，看着精简，实际仍有 1061 个项目，
          # 其中 83 个与 recovery 无关（cts/sdk/developers、device/generic/*、
          # device/google/*、device/linaro|ti|amlogic/*、14 个 kernel/prebuilts/*
          # GKI 预编译内核、prebuilts/{android-emulator,qemu-kernel}）。
          cat > "$HOME/prune_repo.py" <<'PYEOF'
          import os, pathlib, re, subprocess, sys
          tree = sys.argv[1]
          out = "/tmp/prune_manifest.xml"
          subprocess.run(["repo", "manifest", "-o", out], cwd=tree,
                         capture_output=True, text=True)
          txt = pathlib.Path(out).read_text(errors="replace") if os.path.exists(out) else ""
          paths = set(re.findall(r'<project\b[^>]*\bpath="([^"]+)"', txt))
          PREFIX = ("cts", "sdk",
                    "developers/",
                    "device/generic/", "device/google/", "device/amlogic/",
                    "device/asus/", "device/brcm/", "device/linaro/",
                    "device/ti/", "device/sample/",
                    "kernel/prebuilts",
                    "prebuilts/android-emulator", "prebuilts/qemu-kernel")
          TEST_EXACT = {
              "test/dittosuite", "test/robolectric-extensions",
              "test/mlts/benchmark", "test/mlts/models",
              "test/cts-root", "test/mts", "test/suite_harness",
              "test/vts", "test/catbox",
              "test/vts-testcase/hal", "test/vts-testcase/kernel",
              "test/vts-testcase/nbu", "test/vts-testcase/performance",
              "test/vts-testcase/security", "test/vts-testcase/vndk",
          }
          def hit(p):
              if p in TEST_EXACT:
                  return True
              for x in PREFIX:
                  if p == x:
                      return True
                  if x.endswith("/") and p.startswith(x):
                      return True
                  if not x.endswith("/") and p.startswith(x + "/"):
                      return True
              return False
          killed = sorted(p for p in paths if hit(p))
          d = pathlib.Path(tree, ".repo", "local_manifests")
          d.mkdir(parents=True, exist_ok=True)
          (d / "remove.xml").write_text(
              "<manifest>\n" + "".join('  <remove-project path="%s" />\n' % p for p in killed)
              + "</manifest>\n")
          print("== 12.1 清单共 %d 个项目，自动剔除 %d 个 ==" % (len(paths), len(killed)))
          PYEOF

          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path("orangefox_sync.sh")
          s = p.read_text()
          anchor = '  echo "-- Syncing the $TWRP_BRANCH minimal manifest repo ...";'
          if s.count(anchor) == 1:
              s = s.replace(anchor, '  python3 "$HOME/prune_repo.py" "$PWD" || true;\n' + anchor, 1)
              p.write_text(s)
              print("已在 repo init 与 repo sync 之间插入剔除步骤")
          else:
              print("!!! 未找到锚点，跳过剔除注入（不影响编译，只是不省同步量）")
          PYEOF
          # 同步失败（网络抖动/半途补丁）就清空目标目录重来：补丁不重复应用，
          # 而 twrp-12.1 是浅克隆 + 最小 manifest，重来只多花约 5 分钟
          ok=false
          for i in 1 2 3; do
            rm -rf "$FOX_DIR"
            if ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$FOX_DIR"; then
              ok=true
              break
            fi
            echo "=== 第 $i 次同步失败，20 秒后重试 ==="
            sleep 20
          done
          [ "$ok" = true ]
          test -f "$FOX_DIR/build/envsetup.sh"
          echo "=== 同步后源码树体积（剔除前后对比见上一轮日志）==="
          du -sh "$FOX_DIR" 2>/dev/null || true
          df -h /
          echo "=== 同步总耗时: $(( $(date +%s) - SYNC_START )) 秒 ==="

      - name: 放入设备树
        run: |
          set -euo pipefail
          DEST="$FOX_DIR/device/xiaomi/lmi"
          mkdir -p "$DEST"
          rm -rf "$DEST"
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/" "$DEST/"
          rm -rf "$DEST/.git"
          ls -la "$DEST"
          grep OF_MAINTAINER "$DEST/vendorsetup.sh"
          test -f "$DEST/prebuilt/kernel"

      - name: 恢复编译缓存 (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # key 每轮必 miss，靠 restore-keys 回源最近一次缓存；post 阶段再存一份新的
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-

      - name: 编译 Recovery 镜像
        run: |
          # 注意：这里绝对不能加 -u（nounset）——AOSP build/envsetup.sh 会引用未定义的 TOP，
          # 上一轮就是被 "TOP: unbound variable" 直接打断的。
          cd "$FOX_DIR" || exit 1

          # 内存守护：每 30 秒打一张内存快照，runner 若被宿主 OOM 回收可在日志留证
          ( while true; do
              echo "[$(date +%H:%M:%S)] $(free -h | awk '/^Mem:/{print "mem_used="$3" mem_avail="$4} /^Swap:/{print "swap_used="$3}')"
              sleep 30
            done ) &
          WATCHDOG=$!
          trap 'kill "$WATCHDOG" 2>/dev/null || true' EXIT

          free -h
          df -h /

          # OrangeFox 给 envsetup 追加的 orangefox_envsetup()，最后一行是
          #   [ -s $FOX_MANIFEST_ROOT/.../vts/Android.mk ] && echo -n "" > ...
          # 目标文件不存在时条件为假，整个函数就返回 1，于是 source 整体报错
          # —— 但 lunch 其实已经定义好了。先把这条"条件 && 动作"兜底成恒真。
          if grep -q '^[[:space:]]*\[ -s \$FOX_MANIFEST_ROOT' build/make/envsetup.sh; then
            sed -i '/^[[:space:]]*\[ -s \$FOX_MANIFEST_ROOT/ s|$|; true|' build/make/envsetup.sh
            echo "已给 orangefox_envsetup 末行兜底:"
            grep -n '\[ -s \$FOX_MANIFEST_ROOT' build/make/envsetup.sh
          fi

          # 判定成败看 lunch 是否可用，而不是只看 source 的返回码
          ENV_RC=0
          source build/envsetup.sh || ENV_RC=$?
          if ! command -v lunch >/dev/null 2>&1; then
            echo "!!! envsetup 返回 $ENV_RC 且 lunch 未定义 —— 抓定位信息"
            bash -e -x -c 'source build/envsetup.sh' 2>&1 | tail -40 || true
            exit 1
          fi
          echo "envsetup 返回码: $ENV_RC（lunch 可用，继续）"
          lunch "$BUILD_TARGET" || { echo "!!! lunch 失败: $BUILD_TARGET"; exit 1; }

          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.ccache"
          # 显式给 CCACHE_EXEC：A16 起 ccache.mk 不再自动 `which ccache`，
          # 12.1 虽然还能自动探测，但显式写死不依赖版本行为更稳。
          export CCACHE_EXEC="$(command -v ccache || true)"
          if [ -n "$CCACHE_EXEC" ]; then
            ccache -M 6G
            ccache -o compression=true
            ccache -o sloppiness=time_macros,include_file_mtime,file_macro
            ccache -o compiler_check=content
            echo "--- 本次恢复到的 ccache 现状（全是 0 = 缓存没命中）---"
            ccache -s -v | head -20 || true
            ccache -z
          else
            echo "!!! 没找到 ccache，本轮不会有编译缓存"
          fi

          # mka 是 Lineage/TWRP 侧的封装，AOSP 原生 envsetup 只提供 m；缺哪个换哪个
          if command -v mka >/dev/null 2>&1; then
            BUILD_CMD=mka
          else
            BUILD_CMD=m
          fi
          echo "使用编译命令: $BUILD_CMD recoveryimage -j$(($(nproc) * 2))"
          BUILD_START=$(date +%s)
          "$BUILD_CMD" recoveryimage -j$(($(nproc) * 2)) 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          RC=${PIPESTATUS[0]}
          ccache -s || true
          echo "=== 编译耗时: $(( ($(date +%s) - BUILD_START) / 60 )) 分钟 ==="
          echo "=== ninja 目标总数: $(grep -oP '/\d+\]' "$GITHUB_WORKSPACE/build.log" | head -1) ==="
          if [ "$RC" -ne 0 ]; then
            echo "===== 编译失败（exit=$RC），日志最后 80 行 ====="
            tail -80 "$GITHUB_WORKSPACE/build.log" || true
            exit "$RC"
          fi

      - name: 收集产物
        if: always()
        run: |
          set -uo pipefail
          mkdir -p dist
          OUT="$FOX_DIR/out/target/product/lmi"
          if [ -f "$OUT/recovery.img" ]; then
            # grep 找不到版本号会返回 1，本步是 pipefail + 默认 -e，
            # 直接赋值会把整步打死（上一轮 12.1 正是死在这里）→ 必须吞掉
            VER=$(grep -oP '(FOX_MAINTAINER_PATCH_VERSION|FOX_VERSION)\s*=\s*"\K[^"]+' \
                  "$FOX_DIR/device/xiaomi/lmi/vendorsetup.sh" 2>/dev/null | head -1) || VER=""
            if [ -z "$VER" ]; then VER="$FOX_BRANCH"; fi
            NAME="OrangeFox-${VER}-lmi-$(date +%Y%m%d).img"
            cp -v "$OUT/recovery.img" "dist/$NAME"
            echo "文件名: $NAME"
          fi
          if [ -d "$OUT" ]; then
            # 顺带把 OrangeFox 自己打包的成品（签名 zip / 成品 img / md5）也收进来
            find "$OUT" -maxdepth 1 \( -name '*.zip' -o -name '*.tar*' -o -name 'OrangeFox-*' \) \
                 -exec cp -v {} dist/ \; || true
          fi
          echo "=== 产物 ==="
          ls -lh dist/ || true
          ( cd dist && md5sum ./* ) 2>/dev/null || true
          file dist/* 2>/dev/null || true
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            cp "$GITHUB_WORKSPACE/build.log" dist/build.log
          fi

      - name: 校验产物（镜像结构 + A16 关键能力）
        if: always()
        run: |
          set -uo pipefail
          IMG="$FOX_DIR/out/target/product/lmi/recovery.img"
          if [ ! -f "$IMG" ]; then
            echo "没有 recovery.img（编译未产出），跳过校验"
            exit 0
          fi
          # 把「下载产物回本地开刀」这件事搬进 CI：结构性问题直接判失败，
          # 字符串类只打印不判死（不同 fox 版本的嵌入方式不一样）。
          python3 - "$IMG" <<'PYEOF'
          import gzip, struct, sys
          d = open(sys.argv[1], "rb").read()
          ok = True
          def chk(cond, msg):
              global ok
              print(("  [OK]   " if cond else "  [FAIL] ") + msg)
              if not cond:
                  ok = False
          chk(d[:8] == b"ANDROID!", "boot 头 magic = ANDROID!")
          g = lambda o: struct.unpack_from("<I", d, o)[0]
          ks, rs, page, hver, osv = g(8), g(16), g(36), g(40), g(44)
          print(f"  header_version={hver} page_size={page} "
                f"kernel={ks/1048576:.1f}MB ramdisk={rs/1048576:.1f}MB")
          chk(page in (2048, 4096, 8192, 16384), f"page_size 合法（{page}）")
          chk(hver in (0, 1, 2, 3, 4), f"header_version 合法（{hver}）")
          A, B, C = (osv >> 25) & 0x7f, (osv >> 20) & 0x1f, (osv >> 14) & 0x3f
          print(f"  os_version={A}.{B}.{C}")
          roff = page + (ks + page - 1) // page * page
          rd = d[roff:roff + rs]
          chk(rd[:2] == b"\x1f\x8b", "ramdisk 是 gzip")
          out = gzip.decompress(rd)
          print(f"  ramdisk 解压后 {len(out)/1048576:.1f}MB")
          i, files = 0, {}
          while i + 110 <= len(out) and out[i:i+6] == b"070701":
              namesize = int(out[i+94:i+102], 16)
              filesize = int(out[i+54:i+62], 16)
              name = out[i+110:i+110+namesize-1].decode(errors="replace")
              hsz = (110 + namesize + 3) // 4 * 4
              files[name] = (filesize, i + hsz)
              if name == "TRAILER!!!":
                  break
              i = i + hsz + (filesize + 3) // 4 * 4
          chk("system/bin/recovery" in files, "ramdisk 里有 system/bin/recovery")
          fstab = files.get("system/etc/recovery.fstab")
          if fstab:
              txt = out[fstab[1]:fstab[1] + fstab[0]].decode(errors="replace")
              chk("erofs" in txt, "recovery.fstab 里支持 erofs（A16 的 system 格式）")
          rec = files.get("system/bin/recovery")
          if rec:
              blob = out[rec[1]:rec[1] + rec[0]]
              print(f"  recovery 二进制 {rec[0]/1048576:.1f}MB")
              print(f"  [信息] 含维护者串 opencode: {b'opencode' in blob}")
              print(f"  [信息] 含 of_maintainer 键:  {b'of_maintainer' in blob}")
              print(f"  [信息] 含默认语言 zh_CN:     {b'zh_CN' in blob}")
          print("\n校验结论：" + ("通过" if ok else "有问题（见上面 [FAIL]）"))
          sys.exit(0 if ok else 1)
          PYEOF

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-lmi-12.1-${{ github.run_number }}
          path: dist/
          if-no-files-found: warn
          retention-days: 90

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 30
