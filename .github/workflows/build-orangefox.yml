# OrangeFox 16.0 build for Xiaomi lmi / lmipro.
# 流程：准备工具链 -> repo sync（内联裁剪）-> 设备树/补丁 -> ccache -> lunch/build -> 校验/上传。
name: 编译 OrangeFox (lmi)
run-name: 编译 OrangeFox 16.0 (lmi)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: orange-fox-lmi
  cancel-in-progress: false

jobs:
  build-16:
    name: 编译 OrangeFox 16.0 (lmi)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      FOX_BRANCH: fox_16.0
      BUILD_TARGET: twrp_lmi-bp2a-eng
      SYNC_JOBS: '64'
      BUILD_JOBS: '9'
      SWAP_GB: '24'
      FOX_DIR: /home/runner/fox_16.0
      FOX_MANIFEST: https://gitlab.com/OrangeFox/Manifest.git
      ALLOW_MISSING_DEPENDENCIES: 'true'
      GOMEMLIMIT: 8GiB
      GOGC: '50'
      GODEBUG: madvdontneed=1
      LC_ALL: C
    steps:
    - name: 检出设备树
      uses: actions/checkout@v4
      with:
        repository: FreeAsCrazy/lmi-recovery
        ref: main
        fetch-depth: 1
        persist-credentials: false
    - name: 准备构建环境
      run: |
        set -euo pipefail
        echo "=== 清理预装工具链 ==="
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                    /usr/share/swift /usr/local/.ghcup 2>/dev/null || true
        sudo docker image prune -af >/dev/null 2>&1 || true
        sudo apt-get clean >/dev/null 2>&1 || true

        if [ "$SWAP_GB" -gt 0 ]; then
          echo "=== 启用 ${SWAP_GB}G swap ==="
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l "${SWAP_GB}G" /swapfile ||
            sudo dd if=/dev/zero of=/swapfile bs=1M count=$((SWAP_GB * 1024)) status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
        else
          echo "=== SWAP_GB=0，本版本自动不启用 swap ==="
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
        fi
        free -h
        df -h /

        PKGS=(
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg
          gperf imagemagick libc6-dev-i386 libelf-dev libgl1-mesa-dev liblz4-tool zstd
          libncurses-dev libssl-dev libx11-dev lzop openjdk-17-jdk pngcrush python3
          python3-pip rsync schedtool xsltproc unzip zip zlib1g-dev
        )
        apt_install() {
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends "$@"
        }
        # apt 索引过期/网络抖动时 install 会失败：update 后重试一次
        apt_install "${PKGS[@]}" || {
          sudo apt-get update -qq
          apt_install "${PKGS[@]}"
        }
        # noble 移除了 libncurses5/libtinfo5，而 AOSP 预编译 clang 需要 libtinfo.so.5；
        # 从 focal 池补装（best-effort，404 或冲突都不阻断构建）
        N=6.2-0ubuntu2.1
        for P in libtinfo5 libncurses5; do
          curl -fsSL --retry 3 --retry-delay 2 -O "https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/${P}_${N}_amd64.deb" || continue
          sudo dpkg -i "${P}_${N}_amd64.deb" || true
          rm -f "${P}_${N}_amd64.deb"
        done
        df -h /

        mkdir -p "$HOME/bin"
        curl -fsSL --retry 3 --retry-delay 2 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
        chmod +x "$HOME/bin/repo"
        echo "$HOME/bin" >> "$GITHUB_PATH"
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git config --global --replace-all safe.directory '*'
        "$HOME/bin/repo" --version || true

        # AOSP 16 需要 JDK 17
        if [ -n "${JAVA_HOME_17_X64:-}" ] && [ -d "$JAVA_HOME_17_X64" ]; then
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
        fi
        java -version 2>&1 || true
    - name: 同步 OrangeFox 16.0 源码
      run: |
        set -euo pipefail
        SYNC_START=$(date +%s)
        mkdir -p "$FOX_DIR"
        cd "$FOX_DIR"
        # git 检出优化：fresh runner 上无关 fsync，加大 checkout 并行
        git config --global core.fsync none
        git config --global checkout.workers 8
        git config --global core.preloadIndex true
        git config --global feature.manyFiles true
        echo "=== repo init（完整橙狐清单 + 浅克隆）==="
        T_INIT0=$(date +%s)
        repo init --depth=1 -u "$FOX_MANIFEST" -b "$FOX_BRANCH"
        T_INIT1=$(date +%s)

        # 已验证不可裁剪（2026-10-29 实验）：packages/modules/{adb,common,Gki,DnsResolver}、
        # prebuilts/{build-tools,clang/host/linux-x86,jdk/jdk8,rust}、
        # external/{llvm,perfetto,rappor,googletest,rust/android-crates-io,rust/cxx}、
        # frameworks/opt/telephony、tools/tradefederation/core。
        # 最终裁剪 baseline（内联）。
        TRIM_LIST="$RUNNER_TEMP/trim-16.0.txt"
        cat > "$TRIM_LIST" <<'TRIM_EOF'
        device/xiaomi/mondrian
        device/xiaomi/sm84xx-common
        external/clang
        external/cronet
        external/federated-compute
        external/grpc-grpc
        external/grpc-grpc-java
        external/gson
        external/icing
        external/kotlinc
        external/nos/host/generic
        external/okhttp
        external/openthread
        external/openwrt-prebuilts
        external/ot-br-posix
        external/perfmark
        external/private-join-and-compute
        external/puffin
        external/python/bumble
        external/python/mobly
        external/sandboxed-api
        external/skia
        external/tink
        external/uwb
        external/wmediumd
        external/wpa_supplicant_8
        frameworks/libs/binary_translation
        frameworks/libs/gsma_services
        frameworks/libs/modules-utils
        frameworks/opt/net/ims
        frameworks/opt/net/voip
        packages/modules/AdServices
        packages/modules/AppSearch
        packages/modules/Bluetooth
        packages/modules/ConfigInfrastructure
        packages/modules/CrashRecovery
        packages/modules/DeviceLock
        packages/modules/HealthFitness
        packages/modules/IPsec
        packages/modules/ImsMedia
        packages/modules/IntentResolver
        packages/modules/Media
        packages/modules/OnDevicePersonalization
        packages/modules/Permission
        packages/modules/Profiling
        packages/modules/RemoteKeyProvisioning
        packages/modules/RuntimeI18n
        packages/modules/Scheduling
        packages/modules/StatsD
        packages/modules/Telephony
        packages/modules/UprobeStats
        packages/modules/Uwb
        packages/modules/Wifi
        prebuilts/abi-dumps/ndk
        prebuilts/abi-dumps/platform
        prebuilts/abi-dumps/vndk
        prebuilts/bazel/common
        prebuilts/bazel/darwin-x86_64
        prebuilts/bazel/linux-x86_64
        prebuilts/clang-tools
        prebuilts/cmake/linux-x86
        prebuilts/fox-ndk
        prebuilts/fox-rust
        prebuilts/gcc/linux-x86/host/x86_64-w64-mingw32-4.8
        prebuilts/gradle-plugin
        prebuilts/module_sdk/AdServices
        prebuilts/module_sdk/AppSearch
        prebuilts/module_sdk/Bluetooth
        prebuilts/module_sdk/ConfigInfrastructure
        prebuilts/module_sdk/CrashRecovery
        prebuilts/module_sdk/DeviceLock
        prebuilts/module_sdk/HealthFitness
        prebuilts/module_sdk/OnDevicePersonalization
        prebuilts/module_sdk/Profiling
        prebuilts/module_sdk/RemoteKeyProvisioning
        prebuilts/module_sdk/Uwb
        prebuilts/tools
        prebuilts/vndk/v30
        prebuilts/vndk/v31
        prebuilts/vndk/v32
        prebuilts/vndk/v33
        prebuilts/vndk/v34
        tools/apksig
        tools/content_addressed_storage/prebuilts
        tools/deviceinfra/prebuilts
        tools/loganalysis
        tools/metalava
        tools/netsim
        tools/platform-compat
        tools/test/mobly_snippets
        tools/tradefederation/contrib
        TRIM_EOF

        repo manifest -o "$GITHUB_WORKSPACE/manifest-resolved.xml"
        mkdir -p .repo/local_manifests
        MANIFEST_PATHS="$RUNNER_TEMP/manifest-paths.txt"
        REMOVE_TMP="$RUNNER_TEMP/remove-projects.txt"

        grep -oP '<project\b[^>]*\bpath="\K[^"]+' "$GITHUB_WORKSPACE/manifest-resolved.xml" \
          | sort -u > "$MANIFEST_PATHS"

        # 一次读入裁剪表，用 bash 内建匹配，避免为每个 project 启动 grep。
        declare -A TRIM_SET=()
        while IFS= read -r p; do TRIM_SET["$p"]=1; done < "$TRIM_LIST"

        is_removed() {
          local p=$1
          [[ -n ${TRIM_SET[$p]+x} ]] && return 0
          case "$p" in
            cts|cts/*|sdk|sdk/*|developers/*|device/generic/*|device/google/*|device/amlogic/*|device/asus/*|device/brcm/*|device/linaro/*|device/ti/*|device/sample/*|kernel/prebuilts|kernel/prebuilts/*|prebuilts/android-emulator|prebuilts/android-emulator/*|prebuilts/qemu-kernel|prebuilts/qemu-kernel/*) return 0 ;;
            test/dittosuite|test/robolectric-extensions|test/mlts/benchmark|test/mlts/models|test/cts-root|test/mts|test/suite_harness|test/vts|test/catbox|test/vts-testcase/hal|test/vts-testcase/kernel|test/vts-testcase/nbu|test/vts-testcase/performance|test/vts-testcase/security|test/vts-testcase/vndk) return 0 ;;
          esac
          return 1
        }

        while IFS= read -r p; do
          is_removed "$p" && printf '%s\n' "$p"
        done < "$MANIFEST_PATHS" > "$REMOVE_TMP"

        {
          printf '<manifest>\n'
          sed 's/.*/  <remove-project path="&" \/>/' "$REMOVE_TMP"
          # OrangeFox 的 libvpx/libwebm fork 当前匿名访问会跳转 GitLab 登录页（403）。
          # 改用 AOSP 原始仓库，避免 repo sync 因这两个项目整体失败。
          # external/foxcli 的 master 后续依赖 libfox_protocol_types，先固定到旧提交。
          cat <<'AOSP_REPLACE_EOF'
            <remove-project path="external/libvpx" />
            <remove-project path="external/libwebm" />
            <remove-project path="external/foxcli" />
            <project path="external/foxcli" name="external/foxcli" remote="OrangeFox" revision="288f5579550ebd0d5e6325c1844a65bd3fb42d8c" />
            <project path="external/libvpx" name="platform/external/libvpx" remote="aosp" revision="refs/tags/android-16.0.0_r1" />
            <project path="external/libwebm" name="platform/external/libwebm" remote="aosp" revision="refs/tags/android-16.0.0_r1" />
        AOSP_REPLACE_EOF
          printf '</manifest>\n'
        } > .repo/local_manifests/remove.xml

        trim_count=$(wc -l < "$TRIM_LIST")
        remove_count=$(wc -l < "$REMOVE_TMP")
        echo "== 自动剔除 ${remove_count} 个项目（前缀规则 + 裁剪表 ${trim_count} 条）=="
        cat .repo/local_manifests/remove.xml

        echo "=== repo sync ==="
        T_SYNC0=$(date +%s)
        success=false
        for attempt in {1..5}; do
          if repo sync -c -j"$SYNC_JOBS" --optimized-fetch --no-clone-bundle --no-tags --retry-fetches=5; then
            success=true
            break
          fi
          echo "=== 第 $attempt 次 repo sync 失败，20 秒后重试 ==="
          sleep 20
        done
        [ "$success" = true ]
        T_SYNC1=$(date +%s)

        # .repo 和 GKI 预编译内核不参与 recovery 构建。
        rm -rf .repo kernel/prebuilts
        T_END=$(date +%s)
        echo "=== 分段耗时: init=$((T_INIT1-T_INIT0))s sync=$((T_SYNC1-T_SYNC0))s cleanup=$((T_END-T_SYNC1))s ==="
        test -f build/envsetup.sh
        test -d vendor/twrp
        test -d bootable/recovery
        echo "=== 瘦身后磁盘 ==="
        df -h /
        echo "=== 同步总耗时: $(( $(date +%s) - SYNC_START )) 秒 ==="
    - name: 放入设备树并应用补丁
      run: |
        set -euo pipefail
        DEST="$FOX_DIR/device/xiaomi/lmi"
        mkdir -p "$(dirname "$DEST")"
        rm -rf "$DEST"
        rsync -a --exclude='.git' "$GITHUB_WORKSPACE/" "$DEST/"
        APPLY="$RUNNER_TEMP/apply-patches.sh"
        cat > "$APPLY" <<'PATCH_SCRIPT_EOF'
        # A16 兼容补丁（固化在仓库文件里）
        # 由 workflow 在同步源码、放入设备树后调用。
        set -euo pipefail
        : "${FOX_DIR:?FOX_DIR not set}"
        cd "$FOX_DIR"
        D=device/xiaomi/lmi
        
        echo "===== 一、设备树适配 A16 ====="
        
        # 1) A16 对预编译 ELF 强制 16KB 页对齐检查。lmi 是 4KB 页内核，且 recovery/root 里
        #    全是 4K 对齐的老 HIDL 二进制 —— 用检查器官方开关全局豁免
        grep -q 'PRODUCT_CHECK_PREBUILT_MAX_PAGE_SIZE' "$D/device.mk" ||
          echo 'PRODUCT_CHECK_PREBUILT_MAX_PAGE_SIZE := false' >> "$D/device.mk"
        grep -q 'PRODUCT_CHECK_PREBUILT_MAX_PAGE_SIZE := false' "$D/device.mk"
        
        # 2) BoardConfig 里带裸双引号的值会破坏 soong 的 extra.variables JSON
        #    （TARGET_RECOVERY_PIXEL_FORMAT 在 vendor/twrp 的 EXPORT_TO_SOONG 名单里）
        sed -i 's/^\(TARGET_RECOVERY_PIXEL_FORMAT *:*= *\)"\(.*\)"$/\1\2/' "$D/BoardConfig.mk"
        grep -q 'TARGET_RECOVERY_PIXEL_FORMAT := RGBX_8888' "$D/BoardConfig.mk"
        
        # 3) 设备树来自旧基线，硬编码 PLATFORM_VERSION 会与 A16 的版本体系冲突 → 交给构建系统
        sed -i -e '/^PLATFORM_VERSION := /d' -e '/^PLATFORM_VERSION_LAST_STABLE := /d' "$D/BoardConfig.mk"
        
        # 4) 出货 API 对齐 A16
        sed -i 's/^PRODUCT_SHIPPING_API_LEVEL := 29/PRODUCT_SHIPPING_API_LEVEL := 36/' "$D/device.mk"
        grep -q 'PRODUCT_SHIPPING_API_LEVEL := 36' "$D/device.mk"
        
        # 5) A16 的 lunch 走三段式；release 由 vendor/twrp/vars/aosp_target_release 指定（=bp2a）
        grep -q 'twrp_lmi-bp2a-eng' "$D/AndroidProducts.mk" ||
          sed -i 's/twrp_lmi-eng/twrp_lmi-bp2a-eng/' "$D/AndroidProducts.mk"
        grep -q 'twrp_lmi-bp2a-eng' "$D/AndroidProducts.mk"
        
        # 6) 少编一个 toolbox（recovery 已用 toybox），省时间与内存
        if grep -q '^TW_USE_TOOLBOX := true' "$D/BoardConfig.mk"; then
          sed -i 's/^TW_USE_TOOLBOX := true/TW_USE_TOOLBOX := false/' "$D/BoardConfig.mk"
        fi
        grep '^TW_USE_TOOLBOX' "$D/BoardConfig.mk"
        
        echo "===== 二、A16 源码侧修补 ====="
        
        # 1) AID_MEDIA_RW 在 A16 里仍然是 1023（libcutils 私有头），但这些源文件没把它引进来，
        #    会集体报 use of undeclared identifier → 用等值定义兜底
        patched=0
        for f in $(grep -rl "AID_MEDIA_RW" bootable/recovery --include='*.cpp' --include='*.h' 2>/dev/null || true); do
          if ! grep -q '#define AID_MEDIA_RW' "$f"; then
            sed -i "1s|^|#ifndef AID_MEDIA_RW\n#define AID_MEDIA_RW 1023  /* 与 AOSP libcutils 私有头一致 */\n#endif\n\n|" "$f"
            patched=$((patched + 1))
          fi
        done
        echo "AID_MEDIA_RW 兜底完成：$patched 个文件"
        grep -q '#define AID_MEDIA_RW 1023' bootable/recovery/partitionmanager.cpp
        
        # 2) A16 的 clang 默认 -std=gnu23（soong cc/config/global.go: CStdVersion = "gnu23"），
        #    而 C23 里 K&R 旧式函数定义已删除、`foo()` 变成「无参数」——
        #    openaes 是 2008 年的 K&R 代码（rand.c:28 `void isaac(ctx)`、oaes_lib.c 调 `foo()`），
        #    直接编不过。用构建系统的一等开关 LOCAL_C_STD 退回 gnu99（binary.mk:473-479），
        #    比往 LOCAL_CFLAGS 里硬塞 -std= 可靠。
        if [ -f bootable/recovery/openaes/Android.mk ]; then
          # 先把 `LOCAL_CFLAGS:=` 改成 `+=`，否则注入的 -Wno-* 会被这一行整体覆盖
          sed -i 's/^\(\t*\)LOCAL_CFLAGS:= /\1LOCAL_CFLAGS += /' bootable/recovery/openaes/Android.mk
          count=$(grep -c 'include \$(CLEAR_VARS)' bootable/recovery/openaes/Android.mk)
          [ "$count" -ge 3 ] || { echo "openaes/Android.mk 段数异常: $count" >&2; exit 1; }
          tmp=$(mktemp)
          awk '{print} /include \$\(CLEAR_VARS\)/ {print "	LOCAL_C_STD := gnu99"; print "	LOCAL_CFLAGS += -Wno-deprecated-non-prototype -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types"}' bootable/recovery/openaes/Android.mk > "$tmp"
          mv "$tmp" bootable/recovery/openaes/Android.mk
          grep -q 'LOCAL_C_STD := gnu99' bootable/recovery/openaes/Android.mk
          grep -q 'Wno-deprecated-non-prototype' bootable/recovery/openaes/Android.mk
          grep -q 'LOCAL_CFLAGS += -g -c -W' bootable/recovery/openaes/Android.mk
        fi
        
        # 2b) recovery 目录下还有十来个 2010 年前的老 C 模块（libtar/dosfstools/libblkid/
        #     pigz/flashutils/mtdutils/attr/...），和 openaes 一样都是 K&R 时代的产物。
        #     光修 openaes 等于打地鼠，这里给整个目录一次到位：
        #       - 默认 C 标准退回 gnu99（C23 删掉了 K&R 定义、`foo()` 变 (void)）
        #       - 关掉会因全局 -Werror 而致命的旧代码警告
        #     警告只挂到 conlyflags（.c 专用）：挂到 cflags 会落到 C++ 文件上，
        #     而 `-Wno-deprecated-non-prototype` 对 clang++ 是未知告警选项，-Werror 下反成新错误。
        #     global 的 -std=/-Werror 在编译命令里排在模块 flags 之前
        #     （definitions.mk:1652-1661 → $(GLOBAL...) 在 $(PRIVATE_CFLAGS/CONLYFLAGS) 前面），
        #     所以这里后加的会覆盖生效。
        
        if ! grep -q 'my_conlyflags += -Wno-deprecated-non-prototype' build/make/core/binary.mk; then
          count=$(grep -c 'my_c_std_version := \$(LOCAL_C_STD)' build/make/core/binary.mk)
          [ "$count" = 1 ] || { echo "binary.mk C_STD 块数量异常: $count" >&2; exit 1; }
          tmp=$(mktemp)
          awk '
            {print}
            /^[[:space:]]*my_c_std_version := \$\(LOCAL_C_STD\)$/ {marked=1}
            marked && /^[[:space:]]*endif$/ {
              print ""
              print "# OrangeFox: recovery 下多为老式 C 代码，A16 默认 gnu23 编不过 -> 退回 gnu99"
              print "ifneq (,$(filter bootable/recovery bootable/recovery/%,$(LOCAL_PATH)))"
              print "  ifeq ($(LOCAL_C_STD),)"
              print "    my_c_std_version := gnu99"
              print "  endif"
              print "  my_conlyflags += -Wno-deprecated-non-prototype -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types"
              print "endif"
              marked=0
            }
          ' build/make/core/binary.mk > "$tmp"
          mv "$tmp" build/make/core/binary.mk
        fi
        grep -q 'bootable/recovery bootable/recovery/%' build/make/core/binary.mk
        grep -q 'my_conlyflags += -Wno-deprecated-non-prototype' build/make/core/binary.mk
        
        # 3) 清单已移除 test/vts*，但 build/make 的 test-suite 展开仍引用 vts/tvts
        if grep -q 'device-tests vts tvts art-host-tests' build/make/core/main.mk; then
          sed -i 's/device-tests vts tvts art-host-tests/device-tests art-host-tests/' build/make/core/main.mk
          grep -q 'device-tests art-host-tests' build/make/core/main.mk
        
          # 4) libvts_vintf_test_common 被 assemble_vintf 硬依赖，但定义在被移除的
          #    test/vts-testcase/hal 里 → 只补这一模块的 3 个小文件，不整仓恢复
          VLIB=test/vts-testcase/hal/treble/vintf/libvts_vintf_test_common
          if [ ! -f "$VLIB/Android.bp" ]; then
            VURL=https://android.googlesource.com/platform/test/vts-testcase/hal/+/master/treble/vintf/libvts_vintf_test_common
            mkdir -p "$VLIB/include/libvts_vintf_test_common"
            curl -fsSL --retry 3 "$VURL/Android.bp?format=TEXT" | base64 -d > "$VLIB/Android.bp"
            curl -fsSL --retry 3 "$VURL/common.cpp?format=TEXT" | base64 -d > "$VLIB/common.cpp"
            curl -fsSL --retry 3 "$VURL/include/libvts_vintf_test_common/common.h?format=TEXT" | base64 -d > "$VLIB/include/libvts_vintf_test_common/common.h"
          fi
          grep -q 'name: "libvts_vintf_test_common"' "$VLIB/Android.bp"
          [ -s "$VLIB/common.cpp" ]
          echo "libvts_vintf_test_common 已补齐"
        else
          echo "main.mk 无需 vts/tvts 补丁（清单已处理）"
        fi
        
        echo "===== 三、核对结果 ====="
        grep -n 'PRODUCT_CHECK_PREBUILT_MAX_PAGE_SIZE\|PRODUCT_SHIPPING_API_LEVEL' "$D/device.mk"
        grep -n 'TARGET_RECOVERY_PIXEL_FORMAT\|TW_USE_TOOLBOX\|^PLATFORM_VERSION' "$D/BoardConfig.mk"
        grep -n 'LUNCH' "$D/AndroidProducts.mk"
        echo "--- 架构：lmi 为 64 位纯设备，必须没有 32 位第二架构 ---"
        grep -n 'TARGET_ARCH :=\|TARGET_2ND_ARCH\|SUPPORTS_32_BIT\|SUPPORTS_64_BIT' "$D/BoardConfig.mk"
        ! grep -q '^TARGET_2ND_ARCH' "$D/BoardConfig.mk"
        grep -q '^TARGET_SUPPORTS_32_BIT_APPS := false' "$D/BoardConfig.mk"
        df -h /
        
        PATCH_DIR=$(mktemp -d)
        trap 'rm -rf "$PATCH_DIR"' EXIT
        apply_patch() {
          name=$1 marker=$2 target=$3
          if grep -q "$marker" "$target"; then echo "already patched: $name"; return 0; fi
          patch -p0 --forward --fuzz=3 -i "$PATCH_DIR/$name.patch"
          grep -q "$marker" "$target"
        }
        cat > "$PATCH_DIR/meta.patch" <<'META_PATCH_EOF'
        --- system/vold/MetadataCrypt.cpp
        +++ system/vold/MetadataCrypt.cpp
        @@ -1,8 +1,17 @@
             KeyBuffer module_key;
        -    if (options.use_hw_wrapped_key) {
        +    bool actual_use_hw_wrapped_key = options.use_hw_wrapped_key;
        +    if (actual_use_hw_wrapped_key) {
                 if (!exportWrappedStorageKey(key, &module_key)) {
        +#ifdef OF_METADATA_HWWRAPPED_FALLBACK
        +            // Recovery may not be able to export an ICE-wrapped key.
        +            // The raw key is sufficient for mounting metadata-encrypted data.
        +            LOG(WARNING) << "Failed to export wrapped metadata key; using raw key";
        +            module_key = key;
        +            actual_use_hw_wrapped_key = false;
        +#else
                     LOG(ERROR) << "Failed to get ephemeral wrapped key";
                     return false;
        +#endif
                 }
             } else {
                 module_key = key;
        META_PATCH_EOF
        cat > "$PATCH_DIR/fs.patch" <<'FS_PATCH_EOF'
        --- system/vold/FsCrypt.cpp
        +++ system/vold/FsCrypt.cpp
        @@ -1,9 +1,19 @@
             KeyBuffer ephemeral_wrapped_key;
        -    if (options.use_hw_wrapped_key) {
        +    bool use_hw_wrapped_key = options.use_hw_wrapped_key;
        +    EncryptionOptions adjusted_options = options;
        +    if (use_hw_wrapped_key) {
                 if (!exportWrappedStorageKey(key, &ephemeral_wrapped_key)) {
        +#ifdef OF_METADATA_HWWRAPPED_FALLBACK
        +            // Recovery may not be able to export an ICE-wrapped FBE key.
        +            // Install the raw key so CE/DE initialization can proceed.
        +            LOG(WARNING) << "Failed to export wrapped FBE key; using raw key";
        +            use_hw_wrapped_key = false;
        +            adjusted_options.use_hw_wrapped_key = false;
        +#else
                     LOG(ERROR) << "Failed to get ephemeral wrapped key";
                     return false;
        +#endif
                 }
             }
        -    return installKey(mountpoint, options, options.use_hw_wrapped_key ? ephemeral_wrapped_key : key,
        -                      policy);
        +    return installKey(mountpoint, adjusted_options,
        +                      use_hw_wrapped_key ? ephemeral_wrapped_key : key, policy);
        FS_PATCH_EOF
        cat > "$PATCH_DIR/pigz.patch" <<'PIGZ_PATCH_EOF'
        --- bootable/recovery/twrp-functions.cpp
        +++ bootable/recovery/twrp-functions.cpp
        @@ -1,17 +1,27 @@
         	} else {
         		close(logPipe[0]);
        +		bool log_write_failed = false;
         		if (write(logPipe[1], destLogBuffer.c_str(), destLogBuffer.size()) < 0) {
         			LOGINFO("Unable to append to persistent log: %s\n", Destination.c_str());
        -			close(logPipe[1]);
        -			close(destination_fd);
        -			return;
        +			log_write_failed = true;
         		}
        -		if (write(logPipe[1], srcLogBuffer.c_str(), srcLogBuffer.size()) < 0) {
        +		if (!log_write_failed &&
        +		    write(logPipe[1], srcLogBuffer.c_str(), srcLogBuffer.size()) < 0) {
         			LOGINFO("Unable to append to persistent log: %s\n", Destination.c_str());
        -			close(logPipe[1]);
        +			log_write_failed = true;
        +		}
        +		close(logPipe[1]);
        +		if (log_write_failed) {
         			close(destination_fd);
        +			if (pigz_pid > 0) {
        +				int pigz_status;
        +				TWFunc::Wait_For_Child(pigz_pid, &pigz_status, "pigz");
        +			}
         			return;
         		}
        -		close(logPipe[1]);
         	}
         	close(destination_fd);
        +	if (pigz_pid > 0) {
        +		int pigz_status;
        +		TWFunc::Wait_For_Child(pigz_pid, &pigz_status, "pigz");
        +	}
        PIGZ_PATCH_EOF
        
        echo "===== 四、A16 vold 解密修补 ====="
        METADATA="$FOX_DIR/system/vold/MetadataCrypt.cpp"
        FSCRYPT="$FOX_DIR/system/vold/FsCrypt.cpp"
        VOLD_BP="$FOX_DIR/system/vold/Android.bp"
        for f in "$METADATA" "$FSCRYPT" "$VOLD_BP"; do [ -f "$f" ] || { echo "missing $f" >&2; exit 1; }; done
        apply_patch meta OF_METADATA_HWWRAPPED_FALLBACK "$METADATA"
        sed -i 's/if (options.use_hw_wrapped_key) target->SetWrappedKeyV0();/if (actual_use_hw_wrapped_key) target->SetWrappedKeyV0();/' "$METADATA"
        if ! grep -q 'metadata_encryption present; forcing' "$METADATA"; then
          grep -q 'unsigned int options_format_version' "$METADATA" || { echo 'MetadataCrypt options_format_version not found' >&2; exit 1; }
          grep -q 'CryptoOptions options;' "$METADATA" || { echo 'MetadataCrypt CryptoOptions not found' >&2; exit 1; }
          tmp=$(mktemp)
          awk '
            /CryptoOptions options;/ && !done {
              print "    // lmi vendor first_api_level=29, ROM uses v2 dm-default-key."
              print "    if (options_format_version < 2 && !data_rec->metadata_encryption_options.empty()) {"
              print "        LOG(WARNING) << \"metadata_encryption present; forcing dm-default-key format v2\";"
              print "        options_format_version = 2;"
              print "    }"
              print ""
              done=1
            }
            {print}
          ' "$METADATA" > "$tmp"; mv "$tmp" "$METADATA"
        fi
        apply_patch fs OF_METADATA_HWWRAPPED_FALLBACK "$FSCRYPT"
        if ! grep -q -- '-DOF_METADATA_HWWRAPPED_FALLBACK' "$VOLD_BP"; then
          awk '
            /name: "vold_default_flags"/ {inside=1}
            inside && /"-Wno-unused-parameter",/ && !done {
              print
              print "        // OrangeFox: allow raw key when ICE cannot export wrapped key"
              print "        \"-DOF_METADATA_HWWRAPPED_FALLBACK\","
              done=1; next
            }
            {print}
          ' "$VOLD_BP" > "$VOLD_BP.tmp"; mv "$VOLD_BP.tmp" "$VOLD_BP"
        fi
        
        echo "===== 五、Keystore2 watchdog ====="
        MAIN="$FOX_DIR/system/security/keystore2/src/keystore2_main.rs"
        RC="$FOX_DIR/bootable/recovery/etc/init/keystore2.rc"
        if [ -f "$MAIN" ]; then
          if ! grep -q KEYSTORE2_RECOVERY "$MAIN"; then
            awk '
              /^    std::thread::spawn\(keystore2::globals::await_boot_completed\);$/ && !done {
                print "    if std::env::var_os(\"KEYSTORE2_RECOVERY\").is_none() {"
                print "        std::thread::spawn(keystore2::globals::await_boot_completed);"
                print "    }"
                done=1; next
              }
              {print}
            ' "$MAIN" > "$MAIN.tmp"; mv "$MAIN.tmp" "$MAIN"
          fi
          grep -q KEYSTORE2_RECOVERY "$MAIN"
        else echo "警告：未找到 keystore2_main.rs" >&2; fi
        if [ -f "$RC" ]; then
          grep -q 'setenv KEYSTORE2_RECOVERY 1' "$RC" || sed -i '/^service keystore2 /a\    setenv KEYSTORE2_RECOVERY 1' "$RC"
          grep -q 'setenv KEYSTORE2_RECOVERY 1' "$RC"
        else echo "警告：未找到 recovery keystore2.rc" >&2; fi
        
        echo "===== 六、pigz 僵尸修复 ====="
        apply_patch pigz pigz_status "$FOX_DIR/bootable/recovery/twrp-functions.cpp"
        
        echo "===== 七、中文翻译 ====="
        
        files=(
          "$FOX_DIR/bootable/recovery/gui/theme/extra-languages/languages/zh_CN.xml"
          "$FOX_DIR/bootable/recovery/gui/theme/common/languages/zh_CN.xml"
        )
        
        found=0
        for f in "${files[@]}"; do
          [ -f "$f" ] || continue
          if grep -q 'name="backup_av_img"' "$f"; then
            sed -i -E 's|(<string name="backup_av_img">)图片(</string>)|\1镜像\2|' "$f"
            echo "已修正: $f"
            grep -n 'name="backup_av_img"' "$f"
            found=1
          fi
        done
        
        if [ "$found" = 0 ]; then
          echo "警告：没有找到 backup_av_img 翻译项" >&2
        fi
        PATCH_SCRIPT_EOF
        bash "$APPLY"
    - name: 恢复编译缓存 (ccache)
      uses: actions/cache/restore@v4
      with:
        path: ~/.ccache
        key: ccache-a16-${{ github.run_id }}
        restore-keys: |
          ccache-a16-
      id: ccache
    - name: 编译 Recovery 镜像
      run: |
        # 注意：这里绝对不能加 -u（nounset）——AOSP build/envsetup.sh 会引用未定义的 TOP
        cd "$FOX_DIR" || exit 1

        # 每 30 秒记录内存和 RSS 最高的进程，便于排查 OOM。
        ( while true; do
            echo "[$(date +%H:%M:%S)] $(free -h | awk '/^Mem:/{print "mem_used="$3" mem_avail="$4} /^Swap:/{print "swap_used="$3}')"
            ps -eo rss,comm --sort=-rss | head -6 | tail -5 \
              | awk '{printf "  rss=%dMB %s\n", $1/1024, $2}'
            sleep 30
          done ) &
        WATCHDOG=$!
        trap 'kill "$WATCHDOG" 2>/dev/null || true' EXIT

        free -h
        df -h /

        # 兜底 OrangeFox envsetup 的返回值；以 lunch 是否可用判断真实成败。
        if grep -q '^[[:space:]]*\[ -s \$FOX_MANIFEST_ROOT' build/make/envsetup.sh; then
          sed -i '/^[[:space:]]*\[ -s \$FOX_MANIFEST_ROOT/ s|$|; true|' build/make/envsetup.sh
          echo "已给 orangefox_envsetup 末行兜底:"
          grep -n '\[ -s \$FOX_MANIFEST_ROOT' build/make/envsetup.sh
        fi

        ENV_RC=0
        source build/envsetup.sh || ENV_RC=$?
        if ! command -v lunch >/dev/null 2>&1; then
          echo "!!! envsetup 返回 $ENV_RC 且 lunch 未定义 —— 抓定位信息"
          bash -e -x -c 'source build/envsetup.sh' 2>&1 | tail -40 || true
          exit 1
        fi
        echo "envsetup 返回码: $ENV_RC（lunch 可用，继续）"

        # A16 recovery 构建所需开关：跳过 ABI 校验、修正 AVB 时间戳、指定动态分区。
        export SKIP_ABI_CHECKS=true
        export FOX_BUGGED_AOSP_ARB_WORKAROUND="1588606644"
        export FOX_RECOVERY_SYSTEM_PARTITION="/dev/block/mapper/system"
        export FOX_RECOVERY_VENDOR_PARTITION="/dev/block/mapper/vendor"

        # A16 三段式 lunch：release 用 bp2a（vendor/twrp/vars/aosp_target_release）
        lunch "$BUILD_TARGET" \
          || lunch twrp_lmi-ap3a-eng \
          || lunch twrp_lmi-ap2a-eng \
          || { echo "!!! lunch 失败: $BUILD_TARGET"; exit 1; }

        export USE_CCACHE=1
        export CCACHE_DIR="$HOME/.ccache"
        # A16 必须显式设置 CCACHE_EXEC，否则 USE_CCACHE=1 不生效。
        export CCACHE_EXEC="$(command -v ccache || true)"
        if [ -n "$CCACHE_EXEC" ]; then
          ccache -M 6G                 # GitHub 仓库缓存配额 10GB，留出余量
          ccache -o compression=true
          # 源码里大量 __DATE__/__TIME__、且每次 checkout 的 mtime 都变，
          # 不放行这几项的话跨 run 命中率直接归零
          ccache -o sloppiness=time_macros,include_file_mtime,file_macro
          ccache -o compiler_check=content
          echo "--- 本次恢复到的 ccache 现状（全是 0 = 缓存没命中）---"
          ccache -s -v | head -20 || true
          ccache -z
        else
          echo "!!! 没找到 ccache，本轮不会有编译缓存"
        fi

        # TWRP/Lineage 提供 mka，原生 AOSP 使用 m。
        if command -v mka >/dev/null 2>&1; then
          BUILD_CMD=mka
        else
          BUILD_CMD=m
        fi
        echo "使用编译命令: $BUILD_CMD recoveryimage -j$BUILD_JOBS"
        BUILD_START=$(date +%s)
        "$BUILD_CMD" recoveryimage -j"$BUILD_JOBS" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
        RC=${PIPESTATUS[0]}
        if [ -n "$CCACHE_EXEC" ]; then ccache -s || true; fi
        ninja_total=$(grep -m1 -oP '/\d+\]' "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true)
        echo "=== 编译耗时: $(( ($(date +%s) - BUILD_START) / 60 )) 分钟 ==="
        echo "=== ninja 目标总数: ${ninja_total:-unknown} ==="

        if [ "$RC" -ne 0 ]; then
          echo "===== 编译失败（exit=$RC），日志最后 80 行 ====="
          tail -80 "$GITHUB_WORKSPACE/build.log" || true
          echo "===== soong extra.variables 前 45 行（JSON 坏行排查）====="
          sed -n '1,45p' out/soong/soong.twrp_lmi.extra.variables 2>&1 || true
          exit "$RC"
        fi
    - name: 检查 ccache 新增
      if: always()
      id: ccache_new
      run: |
        set -uo pipefail
        misses=$(ccache -s 2>/dev/null | awk '/^[[:space:]]*Misses:/{print $2; exit}')
        case "${misses:-}" in ''|*[!0-9]*) misses=0;; esac
        matched='${{ steps.ccache.outputs.cache-matched-key }}'
        # 首次冷构建或版本化 key 未命中时，保存一份新的版本化缓存。
        if [ -z "$matched" ] || [ "$misses" -gt 0 ]; then
          echo "save=true" >> "$GITHUB_OUTPUT"
          echo "ccache misses=$misses matched='${matched:-none}'，将保存缓存"
        else
          echo "save=false" >> "$GITHUB_OUTPUT"
          echo "ccache misses=0 matched=$matched，跳过重复保存"
        fi
    - name: 保存 ccache
      if: always() && steps.ccache_new.outputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.ccache
        key: ${{ steps.ccache.outputs.cache-primary-key }}
    - name: 收集并校验卡刷包
      if: success()
      run: |
        set -uo pipefail
        rm -rf dist
        mkdir -p dist
        OUT="$FOX_DIR/out/target/product/lmi"
        OUT_IMG="$OUT/recovery.img"

        if [ ! -f "$OUT_IMG" ]; then
          echo "错误：没有找到 recovery.img"
          exit 1
        fi

        # 优先选择完整版 OrangeFox 卡刷包，跳过 lite 版本。
        ZIP_SRC=""
        for z in "$OUT"/*.zip; do
          [ -f "$z" ] || continue
          base=$(basename "$z")
          case "$base" in
            *_lite.zip) continue ;;
            OrangeFox-*.zip) ZIP_SRC="$z"; break ;;
          esac
        done
        if [ -z "$ZIP_SRC" ]; then
          echo "错误：没有找到 OrangeFox 卡刷包 zip"
          ls -lh "$OUT"/*.zip 2>/dev/null || true
          exit 1
        fi
        echo "卡刷包源文件: $ZIP_SRC"

        # 从 OrangeFox zip 名提取版本；失败时使用默认版本。
        FOX_VER=$(basename "$ZIP_SRC" | sed -nE 's/^OrangeFox-([^-]+)-.*/\1/p')
        if [ -z "$FOX_VER" ]; then
          FOX_VER=$(grep -oP '(FOX_MAINTAINER_PATCH_VERSION|FOX_VERSION)\s*=\s*"\K[^"]+' \
                    "$FOX_DIR/device/xiaomi/lmi/vendorsetup.sh" 2>/dev/null | head -1) || true
        fi
        [ -n "$FOX_VER" ] || FOX_VER="R12.0"
        FOX_VER=$(printf '%s' "$FOX_VER" | sed -E 's/[^A-Za-z0-9._-]+/-/g')

        TS=$(date +%Y%m%d%H%M%S)
        BASE="OrangeFox-${FOX_VER}-lmi-A16-${TS}"
        echo "PRODUCT_BASE=${BASE}" >> "$GITHUB_ENV"
        cp -v "$ZIP_SRC" "dist/${BASE}.zip"
        echo "产物: dist/${BASE}.zip"

        echo "=== 卡刷包完整性 ==="
        unzip -t "dist/${BASE}.zip" >/dev/null
        IMG_ENTRY=$(unzip -Z1 "dist/${BASE}.zip" | grep -E '(^|/)recovery\.img$' | head -1 || true)
        if [ -z "$IMG_ENTRY" ]; then
          echo "错误：卡刷包内没有 recovery.img"
          exit 1
        fi
        echo "  [OK]   zip 校验通过，包含 ${IMG_ENTRY}"

        echo "=== 卡刷包内 sdcard/Fox 内容 ==="
        unzip -Z1 "dist/${BASE}.zip" | grep '^sdcard/Fox/' | sort || true

        echo "=== 产物 ==="
        ls -lh dist/ || true
        file dist/* 2>/dev/null || true

        TMP_VERIFY=$(mktemp -d)
        trap 'rm -rf "$TMP_VERIFY"' EXIT
        unzip -p "dist/${BASE}.zip" "$IMG_ENTRY" > "$TMP_VERIFY/recovery.img"
        IMG_SRC="$TMP_VERIFY/recovery.img"
        if [ ! -s "$IMG_SRC" ]; then
          echo "错误：无法从卡刷包中提取 recovery.img"
          exit 1
        fi

        fail=0
        check() {
          if [ "$1" -eq 0 ]; then echo "  [OK]   $2"; else echo "  [FAIL] $2"; fail=1; fi
        }
        u32() { od -An -tu4 -j "$1" -N4 "$IMG_SRC" | tr -d ' \n'; }
        magic=$(head -c 8 "$IMG_SRC" 2>/dev/null || true)
        [ "$magic" = "ANDROID!" ]; check $? "boot 头 magic = ANDROID!"
        KS=$(u32 8); RS=$(u32 16); PAGE=$(u32 36); HVER=$(u32 40); OSV=$(u32 44)
        echo "  header_version=${HVER} page_size=${PAGE} kernel=$((KS/1048576))MB ramdisk=$((RS/1048576))MB"
        case "$PAGE" in 2048|4096|8192|16384) check 0 "page_size 合法（$PAGE）";; *) check 1 "page_size 合法（$PAGE）";; esac
        case "$HVER" in 0|1|2|3|4) check 0 "header_version 合法（$HVER）";; *) check 1 "header_version 合法（$HVER）";; esac
        A=$(((OSV >> 25) & 0x7f)); B=$(((OSV >> 20) & 0x1f)); C=$(((OSV >> 14) & 0x3f))
        echo "  os_version=${A}.${B}.${C}"
        ROFF=$((PAGE + ((KS + PAGE - 1) / PAGE) * PAGE))
        tail -c +$((ROFF + 1)) "$IMG_SRC" | head -c "$RS" > "$TMP_VERIFY/ramdisk.gz" 2>/dev/null || true
        gzip -t "$TMP_VERIFY/ramdisk.gz" 2>/dev/null; check $? "ramdisk 是 gzip"
        gzip -dc "$TMP_VERIFY/ramdisk.gz" > "$TMP_VERIFY/ramdisk.cpio" 2>/dev/null || true
        echo "  ramdisk 解压后 $(( $(wc -c < "$TMP_VERIFY/ramdisk.cpio") / 1048576 ))MB"
        grep -aq 'system/bin/recovery' "$TMP_VERIFY/ramdisk.cpio"; check $? "ramdisk 里有 system/bin/recovery"
        grep -aq 'erofs' "$TMP_VERIFY/ramdisk.cpio"; check $? "recovery.fstab 支持 erofs"
        grep -aq 'opencode' "$TMP_VERIFY/ramdisk.cpio" && echo "  [信息] 含维护者串 opencode: true" || echo "  [信息] 含维护者串 opencode: false"
        grep -aq 'of_maintainer' "$TMP_VERIFY/ramdisk.cpio" && echo "  [信息] 含 of_maintainer 键: true" || echo "  [信息] 含 of_maintainer 键: false"
        grep -aq 'zh_CN' "$TMP_VERIFY/ramdisk.cpio" && echo "  [信息] 含默认语言 zh_CN: true" || echo "  [信息] 含默认语言 zh_CN: false"
        echo
        if [ "$fail" -eq 0 ]; then echo "校验结论：通过"; else echo "校验结论：有问题（见上面 [FAIL]）"; fi
        exit "$fail"
    - name: 上传卡刷包
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PRODUCT_BASE }}
        path: dist/*.zip
        if-no-files-found: error
        retention-days: 7
