name: Build OrangeFox

# 手动触发构建最新橙狐 Recovery（设备树：Xiaomi lmi / POCO F2 Pro）
on:
  workflow_dispatch:
    inputs:
      fox_branch:
        description: "OrangeFox 源码分支"
        required: false
        default: "12.1"
      build_target:
        description: "lunch 目标"
        required: false
        default: "twrp_lmi-eng"

permissions:
  contents: read

concurrency:
  group: orangefox-build
  cancel-in-progress: false

env:
  FOX_BRANCH: ${{ github.event.inputs.fox_branch || '12.1' }}
  BUILD_TARGET: ${{ github.event.inputs.build_target || 'twrp_lmi-eng' }}
  FOX_DIR: /home/runner/fox_12.1

jobs:
  build:
    name: Sync & Build
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== 清理预装工具链以腾出空间 ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean >/dev/null 2>&1 || true
          df -h /

      - name: Add swap
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          free -h

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            bc bison build-essential ccache flex gperf imagemagick liblz4-tool libncurses-dev \
            libssl-dev lzop pngcrush rsync schedtool zip zlib1g-dev
          df -h /

      - name: Install repo tool
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version || true

      - name: Select JDK 11
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_11_X64:-}" ] && [ -d "$JAVA_HOME_11_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_11_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_11_X64/bin" >> "$GITHUB_PATH"
          fi
          java -version 2>&1 || true

      - name: Sync OrangeFox source
        run: |
          set -euo pipefail
          mkdir -p "$HOME/OrangeFox_sync"
          git clone --depth 1 https://gitlab.com/OrangeFox/sync.git "$HOME/OrangeFox_sync/sync"
          cd "$HOME/OrangeFox_sync/sync"
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$FOX_DIR"
          df -h /

      - name: Place device tree
        run: |
          set -euo pipefail
          DEST="$FOX_DIR/device/xiaomi/lmi"
          mkdir -p "$DEST"
          rm -rf "$DEST"
          if command -v rsync >/dev/null 2>&1; then
            rsync -a --exclude='.git' "$GITHUB_WORKSPACE/" "$DEST/"
          else
            cp -a "$GITHUB_WORKSPACE/." "$DEST/"
            rm -rf "$DEST/.git"
          fi
          ls -la "$DEST"
          grep OF_MAINTAINER "$FOX_DIR/device/xiaomi/lmi/vendorsetup.sh"

      - name: Build recovery image
        run: |
          set -euo pipefail
          cd "$FOX_DIR"
          source build/envsetup.sh
          lunch "$BUILD_TARGET"
          mka recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect artifacts
        if: always()
        run: |
          set -uo pipefail
          mkdir -p dist
          OUT="$FOX_DIR/out/target/product/lmi"
          if [ -d "$OUT" ]; then
            find "$OUT" -maxdepth 1 \( -name 'recovery.img' -o -name '*.zip' -o -name '*.tar*' \) \
                 -exec cp -v {} dist/ \;
          fi
          echo "=== 产物 ==="
          ls -lh dist/ || true
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            cp "$GITHUB_WORKSPACE/build.log" dist/build.log
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-lmi-${{ github.run_number }}
          path: dist/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 30
