# OrangeFox 16.0 build for Xiaomi lmi / lmipro.
# 流程：准备工具链 -> repo sync（ci 裁剪）-> 设备树/补丁 -> ccache -> lunch/build -> 校验/上传。
name: 编译 OrangeFox (lmi)
run-name: 编译 OrangeFox 16.0 (lmi)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: orange-fox-lmi
  cancel-in-progress: false

jobs:
  build-16:
    name: 编译 OrangeFox 16.0 (lmi)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      FOX_BRANCH: fox_16.0
      BUILD_TARGET: twrp_lmi-bp2a-eng
      SYNC_JOBS: '64'
      BUILD_JOBS: '9'
      SWAP_GB: '24'
      FOX_DIR: /home/runner/fox_16.0
      FOX_MANIFEST: https://gitlab.com/OrangeFox/Manifest.git
      ALLOW_MISSING_DEPENDENCIES: 'true'
      GOMEMLIMIT: 8GiB
      GOGC: '50'
      GODEBUG: madvdontneed=1
      LC_ALL: C
    steps:
    - name: 检出设备树
      uses: actions/checkout@v4
      with:
        repository: FreeAsCrazy/lmi-recovery
        ref: main
        fetch-depth: 1
        persist-credentials: false
    - name: 准备构建环境
      run: bash "$GITHUB_WORKSPACE/.github/ci/setup-env.sh"
    - name: 同步 OrangeFox 16.0 源码
      run: bash "$GITHUB_WORKSPACE/.github/ci/sync-source.sh"
    - name: 放入设备树并应用补丁
      run: |
        set -euo pipefail
        DEST="$FOX_DIR/device/xiaomi/lmi"
        mkdir -p "$(dirname "$DEST")"
        rm -rf "$DEST"
        rsync -a --exclude='.git' --exclude='.github' "$GITHUB_WORKSPACE/" "$DEST/"
        # 补丁脚本与补丁文件统一放在 .github/ci/ 下。
        bash "$GITHUB_WORKSPACE/.github/ci/apply-patches.sh"
    - name: 恢复编译缓存 (ccache)
      uses: actions/cache/restore@v4
      with:
        path: ~/.ccache
        # run_attempt 避免同一次运行 Re-run 时撞上不可变的 cache key。
        key: ccache-a16-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ccache-a16-
      id: ccache
    - name: 编译 Recovery 镜像
      run: bash "$GITHUB_WORKSPACE/.github/ci/build-recovery.sh"
    - name: 检查 ccache 新增
      if: always()
      id: ccache_new
      run: |
        set -uo pipefail
        misses=$(ccache -s 2>/dev/null | awk '/^[[:space:]]*Misses:/{print $2; exit}')
        case "${misses:-}" in ''|*[!0-9]*) misses=0;; esac
        matched='${{ steps.ccache.outputs.cache-matched-key }}'
        # 首次冷构建或版本化 key 未命中时，保存一份新的版本化缓存。
        if [ -z "$matched" ] || [ "$misses" -gt 0 ]; then
          echo "save=true" >> "$GITHUB_OUTPUT"
          echo "ccache misses=$misses matched='${matched:-none}'，将保存缓存"
        else
          echo "save=false" >> "$GITHUB_OUTPUT"
          echo "ccache misses=0 matched=$matched，跳过重复保存"
        fi
    - name: 保存 ccache
      if: always() && steps.ccache_new.outputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.ccache
        key: ${{ steps.ccache.outputs.cache-primary-key }}
    - name: 收集并校验 Recovery 镜像
      run: bash "$GITHUB_WORKSPACE/.github/ci/collect-image.sh"
    - name: 上传 Recovery 镜像
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PRODUCT_BASE }}
        path: dist/*.img
        if-no-files-found: error
        retention-days: 7
