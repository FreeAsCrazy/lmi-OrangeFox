name: 编译 OrangeFox Recovery 16.0 (lmi)

# 手动触发：编译最新版橙狐（Android 16 / fox_16.0，设备 Xiaomi lmi）
# 基础：OrangeFox 完整清单 fox_16.0（AOSP A16 + 橙狐 fork）
# 加固手法参考 FreeAsCrazy/lmi-recovery 的 build-lmi-recovery.yml（A16 踩坑经验）
on:
  workflow_dispatch:
    inputs:
      fox_branch:
        description: "OrangeFox 清单分支"
        required: false
        default: "fox_16.0"
      build_target:
        description: "lunch 目标"
        required: false
        default: "twrp_lmi-bp2a-eng"

permissions:
  contents: read

# 同一仓库同时只跑一个构建，新触发排队而不打断进行中的编译
concurrency:
  group: orangefox-build-16
  cancel-in-progress: false

env:
  FOX_BRANCH: ${{ github.event.inputs.fox_branch || 'fox_16.0' }}
  BUILD_TARGET: ${{ github.event.inputs.build_target || 'twrp_lmi-bp2a-eng' }}
  FOX_DIR: /home/runner/fox_16.0
  FOX_MANIFEST: https://gitlab.com/OrangeFox/Manifest.git
  # ---- AOSP 构建环境 ----
  ALLOW_MISSING_DEPENDENCIES: "true"  # recovery 构建允许缺失的非必需依赖
  GOMEMLIMIT: 12GiB                   # 压住 soong(Go) 分析 Android.bp 的内存峰值
  LC_ALL: C

jobs:
  build:
    name: 同步源码 & 编译镜像
    # 固定 24.04：ubuntu-latest 会随时间滚动；22.04 已进入退役倒计时（2027-04）
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出设备树
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          echo "=== 清理预装工具链以腾出空间 ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean >/dev/null 2>&1 || true
          df -h /

      - name: 添加 swap
        run: |
          # 7G 物理内存 + 24G swap：lunch/kati 阶段内存峰值高
          sudo swapoff -a 2>/dev/null || true
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          free -h
          df -h /

      - name: 安装编译依赖
        run: |
          set -euo pipefail
          PKGS="bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg \
                 gperf imagemagick libc6-dev-i386 libelf-dev libgl1-mesa-dev liblz4-tool \
                 libncurses-dev libssl-dev libx11-dev lzop openjdk-17-jdk pngcrush python3 \
                 python3-pip rsync schedtool xsltproc zip zlib1g-dev"
          # apt 索引过期/网络抖动时 install 会失败：update 后重试一次
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $PKGS || {
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $PKGS
          }
          # noble 移除了 libncurses5/libtinfo5，而 AOSP 预编译 clang 需要 libtinfo.so.5；
          # 从 focal 池补装（best-effort，404 或冲突都不阻断构建）
          N=6.2-0ubuntu2.1
          for P in libtinfo5 libncurses5; do
            curl -fsSL --retry 3 -O "http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/${P}_${N}_amd64.deb" || continue
            sudo dpkg -i "${P}_${N}_amd64.deb" || true
            rm -f "${P}_${N}_amd64.deb"
          done
          df -h /

      - name: 安装 repo 工具
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global --add safe.directory '*'
          "$HOME/bin/repo" --version || true

      - name: 选择 JDK 17
        run: |
          set -euo pipefail
          # AOSP 16 需要 JDK 17
          if [ -n "${JAVA_HOME_17_X64:-}" ] && [ -d "$JAVA_HOME_17_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          fi
          java -version 2>&1 || true

      - name: 同步 OrangeFox 16.0 源码
        run: |
          set -euo pipefail
          mkdir -p "$FOX_DIR"
          cd "$FOX_DIR"
          echo "=== repo init（完整橙狐清单 + 浅克隆）==="
          repo init --depth=1 -u "$FOX_MANIFEST" -b "$FOX_BRANCH"

          # 橙狐清单自带 remove-minimal.xml（已剔除 600+ 无关项目），这里再补一刀：
          # 干掉 cts/sdk/test 等与 recovery 无关的大块。只对"清单里确实存在"的路径生效，
          # 否则 repo 会因 remove-project 指向不存在项目而解析失败。
          repo manifest -o "$RUNNER_TEMP/manifest.xml"
          mkdir -p .repo/local_manifests
          {
            echo '<manifest>'
            for p in cts sdk developers/build developers/samples/android \
                     device/generic/arm64 device/generic/armv7-a-neon device/generic/art \
                     device/generic/car device/generic/common device/generic/goldfish \
                     device/generic/goldfish-opengl device/generic/trusty device/generic/x86 \
                     device/generic/x86_64 device/google/atv device/google/contexthub \
                     device/google/common/etm device/google/cuttlefish \
                     device/google/cuttlefish_prebuilts device/google/cuttlefish_vmm \
                     device/google/trout \
                     test/dittosuite test/robolectric-extensions test/mlts/benchmark \
                     test/mlts/models test/cts-root test/mts test/suite_harness \
                     test/vts test/vts-testcase/hal test/vts-testcase/kernel \
                     test/vts-testcase/nbu test/vts-testcase/performance \
                     test/vts-testcase/security test/vts-testcase/vndk test/catbox; do
              grep -qE "(path|name)=\"$p\"" "$RUNNER_TEMP/manifest.xml" &&
                echo "  <remove-project path=\"$p\" />"
            done
            echo '</manifest>'
          } > .repo/local_manifests/remove.xml
          echo "=== 已排除 $(grep -c remove-project .repo/local_manifests/remove.xml) 个项目 ==="
          cat .repo/local_manifests/remove.xml

          echo "=== repo sync ==="
          success=false
          for i in 1 2 3 4 5; do
            if repo sync -c -j32 --force-sync --no-clone-bundle --no-tags --retry-fetches=5; then
              success=true
              break
            fi
            echo "=== 第 $i 次 repo sync 失败，20 秒后重试 ==="
            sleep 20
          done
          [ "$success" = true ]

          # .repo 体积大且构建不需要它；GKI 预编译内核与 recovery 无关，但会加大 soong 分析内存
          du -sh .repo 2>/dev/null || true
          rm -rf .repo
          rm -rf kernel/prebuilts
          test -f build/envsetup.sh
          test -d vendor/twrp
          test -d bootable/recovery
          df -h /

      - name: 放入设备树
        run: |
          set -euo pipefail
          DEST="$FOX_DIR/device/xiaomi/lmi"
          mkdir -p "$DEST"
          rm -rf "$DEST"
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/" "$DEST/"
          rm -rf "$DEST/.git"
          ls -la "$DEST"
          grep OF_MAINTAINER "$DEST/vendorsetup.sh"

      - name: 应用 A16 兼容补丁
        run: |
          set -euo pipefail
          cd "$FOX_DIR"
          D=device/xiaomi/lmi

          echo "===== 一、设备树适配 A16 ====="

          # 1) A16 对预编译 ELF 强制 16KB 页对齐检查。lmi 是 4KB 页内核，且 recovery/root 里
          #    全是 4K 对齐的老 HIDL 二进制 —— 用检查器官方开关全局豁免
          grep -q 'PRODUCT_CHECK_PREBUILT_MAX_PAGE_SIZE' "$D/device.mk" ||
            echo 'PRODUCT_CHECK_PREBUILT_MAX_PAGE_SIZE := false' >> "$D/device.mk"
          grep -q 'PRODUCT_CHECK_PREBUILT_MAX_PAGE_SIZE := false' "$D/device.mk"

          # 2) BoardConfig 里带裸双引号的值会破坏 soong 的 extra.variables JSON
          #    （TARGET_RECOVERY_PIXEL_FORMAT 在 vendor/twrp 的 EXPORT_TO_SOONG 名单里）
          sed -i 's/^\(TARGET_RECOVERY_PIXEL_FORMAT *:*= *\)"\(.*\)"$/\1\2/' "$D/BoardConfig.mk"
          grep -q 'TARGET_RECOVERY_PIXEL_FORMAT := RGBX_8888' "$D/BoardConfig.mk"

          # 3) 本树是 12.1 时代的，硬编码 PLATFORM_VERSION 会与 A16 的版本体系打架 → 交给构建系统
          sed -i -e '/^PLATFORM_VERSION := /d' -e '/^PLATFORM_VERSION_LAST_STABLE := /d' "$D/BoardConfig.mk"

          # 4) 出货 API 对齐 A16
          sed -i 's/^PRODUCT_SHIPPING_API_LEVEL := 29/PRODUCT_SHIPPING_API_LEVEL := 36/' "$D/device.mk"
          grep -q 'PRODUCT_SHIPPING_API_LEVEL := 36' "$D/device.mk"

          # 5) A16 的 lunch 走三段式；release 由 vendor/twrp/vars/aosp_target_release 指定（=bp2a）
          sed -i 's/twrp_lmi-eng/twrp_lmi-bp2a-eng/' "$D/AndroidProducts.mk"
          grep -q 'twrp_lmi-bp2a-eng' "$D/AndroidProducts.mk"

          # 6) 少编一个 toolbox（recovery 已用 toybox），省时间与内存
          if grep -q '^TW_USE_TOOLBOX := true' "$D/BoardConfig.mk"; then
            sed -i 's/^TW_USE_TOOLBOX := true/TW_USE_TOOLBOX := false/' "$D/BoardConfig.mk"
          fi
          grep '^TW_USE_TOOLBOX' "$D/BoardConfig.mk"

          echo "===== 二、A16 源码侧修补 ====="

          # 1) AID_MEDIA_RW 在 A16 里仍然是 1023（libcutils 私有头），但这些源文件没把它引进来，
          #    会集体报 use of undeclared identifier → 用等值定义兜底
          patched=0
          for f in $(grep -rl "AID_MEDIA_RW" bootable/recovery --include='*.cpp' --include='*.h' 2>/dev/null || true); do
            if ! grep -q '#define AID_MEDIA_RW' "$f"; then
              sed -i "1s|^|#ifndef AID_MEDIA_RW\n#define AID_MEDIA_RW 1023  /* 与 AOSP libcutils 私有头一致 */\n#endif\n\n|" "$f"
              patched=$((patched + 1))
            fi
          done
          echo "AID_MEDIA_RW 兜底完成：$patched 个文件"
          grep -q '#define AID_MEDIA_RW 1023' bootable/recovery/partitionmanager.cpp

          # 2) A16 的 clang 默认 -std=gnu23（soong cc/config/global.go: CStdVersion = "gnu23"），
          #    而 C23 里 K&R 旧式函数定义已删除、`foo()` 变成「无参数」——
          #    openaes 是 2008 年的 K&R 代码（rand.c:28 `void isaac(ctx)`、oaes_lib.c 调 `foo()`），
          #    直接编不过。用构建系统的一等开关 LOCAL_C_STD 退回 gnu99（binary.mk:473-479），
          #    比往 LOCAL_CFLAGS 里硬塞 -std= 可靠。
          if [ -f bootable/recovery/openaes/Android.mk ]; then
            # 先把 `LOCAL_CFLAGS:=` 改成 `+=`，否则注入的 -Wno-* 会被这一行整体覆盖
            sed -i 's/^\(\t*\)LOCAL_CFLAGS:= /\1LOCAL_CFLAGS += /' bootable/recovery/openaes/Android.mk
            python3 - <<'PYEOF'
          p = "bootable/recovery/openaes/Android.mk"
          s = open(p).read()
          ins = ("\tLOCAL_C_STD := gnu99\n"
                 "\tLOCAL_CFLAGS += -Wno-deprecated-non-prototype"
                 " -Wno-error=implicit-function-declaration"
                 " -Wno-error=int-conversion"
                 " -Wno-error=incompatible-function-pointer-types\n")
          n = s.count("include $(CLEAR_VARS)")
          assert n >= 3, "openaes/Android.mk 段数异常: %d" % n
          s = s.replace("include $(CLEAR_VARS)", "include $(CLEAR_VARS)\n" + ins)
          open(p, "w").write(s)
          print("openaes: 注入 gnu99 x", n)
          PYEOF
            grep -q 'LOCAL_C_STD := gnu99' bootable/recovery/openaes/Android.mk
            grep -q 'Wno-deprecated-non-prototype' bootable/recovery/openaes/Android.mk
            grep -q 'LOCAL_CFLAGS += -g -c -W' bootable/recovery/openaes/Android.mk
          fi

          # 2b) recovery 目录下还有十来个 2010 年前的老 C 模块（libtar/dosfstools/libblkid/
          #     pigz/flashutils/mtdutils/attr/...），和 openaes 一样都是 K&R 时代的产物。
          #     光修 openaes 等于打地鼠，这里给整个目录一次到位：
          #       - 默认 C 标准退回 gnu99（C23 删掉了 K&R 定义、`foo()` 变 (void)）
          #       - 关掉会因全局 -Werror 而致命的旧代码警告
          #     警告只挂到 conlyflags（.c 专用）：挂到 cflags 会落到 C++ 文件上，
          #     而 `-Wno-deprecated-non-prototype` 对 clang++ 是未知告警选项，-Werror 下反成新错误。
          #     global 的 -std=/-Werror 在编译命令里排在模块 flags 之前
          #     （definitions.mk:1652-1661 → $(GLOBAL...) 在 $(PRIVATE_CFLAGS/CONLYFLAGS) 前面），
          #     所以这里后加的会覆盖生效。
          python3 - <<'PYEOF'
          p = "build/make/core/binary.mk"
          s = open(p).read()
          old = ("ifeq ($(LOCAL_C_STD),)\n"
                 "    my_c_std_version := $(DEFAULT_C_STD_VERSION)\n"
                 "else ifeq ($(LOCAL_C_STD),experimental)\n"
                 "    my_c_std_version := $(EXPERIMENTAL_C_STD_VERSION)\n"
                 "else\n"
                 "    my_c_std_version := $(LOCAL_C_STD)\n"
                 "endif\n")
          assert s.count(old) == 1, "binary.mk 的 C_STD 解析块与预期不符"
          new = old + (
              "\n# OrangeFox: recovery 下多为老式 C 代码，A16 默认 gnu23 编不过 -> 退回 gnu99\n"
              "ifneq (,$(filter bootable/recovery bootable/recovery/%,$(LOCAL_PATH)))\n"
              "  ifeq ($(LOCAL_C_STD),)\n"
              "    my_c_std_version := gnu99\n"
              "  endif\n"
              "  my_conlyflags += -Wno-deprecated-non-prototype"
              " -Wno-error=implicit-function-declaration"
              " -Wno-error=int-conversion"
              " -Wno-error=incompatible-function-pointer-types\n"
              "endif\n")
          s = s.replace(old, new, 1)
          open(p, "w").write(s)
          print("binary.mk: bootable/recovery -> gnu99 + 旧 C 代码告警放行")
          PYEOF
          grep -q 'bootable/recovery bootable/recovery/%' build/make/core/binary.mk
          grep -q 'my_conlyflags += -Wno-deprecated-non-prototype' build/make/core/binary.mk

          # 3) 清单已移除 test/vts*，但 build/make 的 test-suite 展开仍引用 vts/tvts
          if grep -q 'device-tests vts tvts art-host-tests' build/make/core/main.mk; then
            sed -i 's/device-tests vts tvts art-host-tests/device-tests art-host-tests/' build/make/core/main.mk
            grep -q 'device-tests art-host-tests' build/make/core/main.mk

            # 4) libvts_vintf_test_common 被 assemble_vintf 硬依赖，但定义在被移除的
            #    test/vts-testcase/hal 里 → 只补这一模块的 3 个小文件，不整仓恢复
            VLIB=test/vts-testcase/hal/treble/vintf/libvts_vintf_test_common
            if [ ! -f "$VLIB/Android.bp" ]; then
              VURL=https://android.googlesource.com/platform/test/vts-testcase/hal/+/master/treble/vintf/libvts_vintf_test_common
              mkdir -p "$VLIB/include/libvts_vintf_test_common"
              curl -fsSL --retry 3 "$VURL/Android.bp?format=TEXT" | base64 -d > "$VLIB/Android.bp"
              curl -fsSL --retry 3 "$VURL/common.cpp?format=TEXT" | base64 -d > "$VLIB/common.cpp"
              curl -fsSL --retry 3 "$VURL/include/libvts_vintf_test_common/common.h?format=TEXT" | base64 -d > "$VLIB/include/libvts_vintf_test_common/common.h"
            fi
            grep -q 'name: "libvts_vintf_test_common"' "$VLIB/Android.bp"
            [ -s "$VLIB/common.cpp" ]
            echo "libvts_vintf_test_common 已补齐"
          else
            echo "main.mk 无需 vts/tvts 补丁（清单已处理）"
          fi

          echo "===== 三、核对结果 ====="
          grep -n 'PRODUCT_CHECK_PREBUILT_MAX_PAGE_SIZE\|PRODUCT_SHIPPING_API_LEVEL' "$D/device.mk"
          grep -n 'TARGET_RECOVERY_PIXEL_FORMAT\|TW_USE_TOOLBOX\|^PLATFORM_VERSION' "$D/BoardConfig.mk"
          grep -n 'LUNCH' "$D/AndroidProducts.mk"
          df -h /

      - name: 恢复编译缓存 (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # key 每轮必 miss，靠 restore-keys 回源最近一次缓存；post 阶段再存一份新的
          key: ccache-a16-${{ github.run_id }}
          restore-keys: |
            ccache-a16-
            ccache-

      - name: 编译 Recovery 镜像
        run: |
          # 注意：这里绝对不能加 -u（nounset）——AOSP build/envsetup.sh 会引用未定义的 TOP
          cd "$FOX_DIR" || exit 1

          # 内存守护：每 30 秒打一张内存快照 + top5 RSS 进程，
          # runner 被宿主 OOM 回收时日志里可留证
          ( while true; do
              echo "[$(date +%H:%M:%S)] $(free -h | awk '/^Mem:/{print "mem_used="$3" mem_avail="$4} /^Swap:/{print "swap_used="$3}')"
              ps -eo rss,comm --sort=-rss | head -6 | tail -5 \
                | awk '{printf "  rss=%dMB %s\n", $1/1024, $2}'
              sleep 30
            done ) &
          WATCHDOG=$!
          trap 'kill "$WATCHDOG" 2>/dev/null || true' EXIT

          free -h
          df -h /

          # OrangeFox 给 envsetup 追加的 orangefox_envsetup()，末尾那条
          #   [ -s $FOX_MANIFEST_ROOT/.../vts/Android.mk ] && echo -n "" > ...
          # 目标文件不存在时条件为假 → 函数返回 1 → source 整体报错，但 lunch 已就绪。
          # 先兜底成恒真，再用 lunch 是否可用来判定真实成败。
          if grep -q '^[[:space:]]*\[ -s \$FOX_MANIFEST_ROOT' build/make/envsetup.sh; then
            sed -i '/^[[:space:]]*\[ -s \$FOX_MANIFEST_ROOT/ s|$|; true|' build/make/envsetup.sh
            echo "已给 orangefox_envsetup 末行兜底:"
            grep -n '\[ -s \$FOX_MANIFEST_ROOT' build/make/envsetup.sh
          fi

          ENV_RC=0
          source build/envsetup.sh || ENV_RC=$?
          if ! command -v lunch >/dev/null 2>&1; then
            echo "!!! envsetup 返回 $ENV_RC 且 lunch 未定义 —— 抓定位信息"
            bash -e -x -c 'source build/envsetup.sh' 2>&1 | tail -40 || true
            exit 1
          fi
          echo "envsetup 返回码: $ENV_RC（lunch 可用，继续）"

          # OrangeFox 在 A16 上的实测开关（取自 FreeAsCrazy/lmi-recovery 的
          # build-lmi-recovery.yml）：
          #   SKIP_ABI_CHECKS —— 预编译 ELF 的 ABI/VNDK 校验对 recovery 无意义，放行
          #   FOX_BUGGED_AOSP_ARB_WORKAROUND —— Android 12+ AVB 回滚计数的「闰年」bug，
          #                       不设的话 patch-vbmeta 会算出错误的时间戳
          #   FOX_RECOVERY_*_PARTITION —— A16 动态分区下 fox 挂载 system/vendor 的映射名
          export SKIP_ABI_CHECKS=true
          export FOX_BUGGED_AOSP_ARB_WORKAROUND="1588606644"
          export FOX_RECOVERY_SYSTEM_PARTITION="/dev/block/mapper/system"
          export FOX_RECOVERY_VENDOR_PARTITION="/dev/block/mapper/vendor"

          # A16 三段式 lunch：release 用 bp2a（vendor/twrp/vars/aosp_target_release）
          lunch "$BUILD_TARGET" \
            || lunch twrp_lmi-ap3a-eng \
            || lunch twrp_lmi-ap2a-eng \
            || { echo "!!! lunch 失败: $BUILD_TARGET"; exit 1; }

          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.ccache"
          if command -v ccache >/dev/null 2>&1; then
            ccache -M 7G
            ccache -o compression=true
            ccache -z
          fi

          # mka 是 TWRP/Lineage 侧的封装，AOSP 原生 envsetup 只提供 m；缺哪个换哪个
          if command -v mka >/dev/null 2>&1; then
            BUILD_CMD=mka
          else
            BUILD_CMD=m
          fi
          echo "使用编译命令: $BUILD_CMD recoveryimage -j$(($(nproc) * 2))"
          "$BUILD_CMD" recoveryimage -j$(($(nproc) * 2)) 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          RC=${PIPESTATUS[0]}
          ccache -s || true

          if [ "$RC" -ne 0 ]; then
            echo "===== 编译失败（exit=$RC），日志最后 80 行 ====="
            tail -80 "$GITHUB_WORKSPACE/build.log" || true
            echo "===== soong extra.variables 前 45 行（JSON 坏行排查）====="
            sed -n '1,45p' out/soong/soong.twrp_lmi.extra.variables 2>&1 || true
            exit "$RC"
          fi

      - name: 收集产物
        if: always()
        run: |
          set -uo pipefail
          mkdir -p dist
          OUT="$FOX_DIR/out/target/product/lmi"
          if [ -f "$OUT/recovery.img" ]; then
            # grep 找不到版本号会返回 1，本步是 pipefail + 默认 -e，
            # 直接赋值会把整步打死（上一轮 12.1 就死在这里）→ 必须吞掉
            VER=$(grep -oP '(FOX_MAINTAINER_PATCH_VERSION|FOX_VERSION)\s*=\s*"\K[^"]+' \
                  "$FOX_DIR/device/xiaomi/lmi/vendorsetup.sh" 2>/dev/null | head -1) || VER=""
            if [ -z "$VER" ]; then VER="16.0"; fi
            NAME="OrangeFox-${VER}-lmi-$(date +%Y%m%d).img"
            cp -v "$OUT/recovery.img" "dist/$NAME"
            echo "文件名: $NAME"
          fi
          if [ -d "$OUT" ]; then
            # 顺带把 OrangeFox 自己打包的成品（签名 zip / 成品 img / md5）也收进来
            find "$OUT" -maxdepth 1 \( -name '*.zip' -o -name '*.tar*' -o -name 'OrangeFox-*' \) \
                 -exec cp -v {} dist/ \; || true
          fi
          echo "=== 产物 ==="
          ls -lh dist/ || true
          ( cd dist && md5sum ./* ) 2>/dev/null || true
          file dist/* 2>/dev/null || true
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            cp "$GITHUB_WORKSPACE/build.log" dist/build.log
          fi

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-lmi-16.0-${{ github.run_number }}
          path: dist/
          if-no-files-found: warn
          retention-days: 90

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 30
