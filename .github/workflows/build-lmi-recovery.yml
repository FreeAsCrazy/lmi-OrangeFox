name: 编译 lmi Recovery

on:
  workflow_dispatch:

concurrency:
  group: lmi-recovery-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      # ============================================================
      # 步骤 1：环境准备
      # ============================================================
      - name: 1. 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: 2. 安装依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip ccache rsync
          # noble 移除了 libncurses5，AOSP prebuilt clang 需要 libncurses.so.5
          N=6.2-0ubuntu2.1
          curl -fsSL --retry 3 -O "http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_${N}_amd64.deb"
          curl -fsSL --retry 3 -O "http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_${N}_amd64.deb"
          sudo dpkg -i "libtinfo5_${N}_amd64.deb" "libncurses5_${N}_amd64.deb" || true
          sudo apt-get clean

      - name: 3. 恢复编译缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-lmi-${{ github.run_id }}
          restore-keys: |
            ccache-lmi-

      # ============================================================
      # 步骤 2：同步源码
      # ============================================================
      - name: 4. 同步 OrangeFox 源码
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          mkdir -p /home/runner/work_build && cd /home/runner/work_build
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0
          repo manifest -o "$RUNNER_TEMP/manifest.xml"
          mkdir -p .repo/local_manifests
          {
            echo '<manifest>'
            for p in cts developers/build developers/samples/android \
              device/generic/arm64 device/generic/armv7-a-neon device/generic/art \
              device/generic/car device/generic/common device/generic/goldfish \
              device/generic/goldfish-opengl device/generic/trusty device/generic/x86 \
              device/generic/x86_64 device/google/atv device/google/contexthub \
              device/google/common/etm device/google/cuttlefish \
              device/google/cuttlefish_prebuilts device/google/cuttlefish_vmm \
              device/google/trout sdk test/dittosuite test/robolectric-extensions \
              test/mlts/benchmark test/mlts/models test/cts-root \
              test/mts test/suite_harness test/vts test/vts-testcase/hal \
              test/vts-testcase/kernel test/vts-testcase/nbu test/vts-testcase/performance \
              test/vts-testcase/security test/vts-testcase/vndk test/catbox; do
              grep -qE "(path|name)=\"$p\"" "$RUNNER_TEMP/manifest.xml" &&
                echo "  <remove-project path=\"$p\" />"
            done
            echo '</manifest>'
          } > .repo/local_manifests/remove.xml

          success=false
          for i in 1 2 3 4 5; do
            if repo sync -c -j32 --force-sync --no-clone-bundle --no-tags --retry-fetches=5; then
              success=true; break
            fi
            echo "=== 第 $i 次 sync 失败，15 秒后重试 ==="; sleep 15
          done
          [ "$success" = true ] || exit 1
          rm -rf .repo
          find . -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          rm -rf kernel/prebuilts
          echo "=== sync 完成，关键目录检查："
          for d in build/make build/soong bootable/recovery vendor/twrp system/vold system/core; do
            [ -d "$d" ] && echo "  ✓ $d" || echo "  ✗ $d 缺失"
          done
          df -h /

      # ============================================================
      # 步骤 3：放入设备树（crDroid A16 + ScribeSavant TWRP 配置）
      # ============================================================
      - name: 5. 放入设备树
        run: |
          cd /home/runner/work_build
          mkdir -p device/xiaomi
          # 5a. crDroid A16 ROM 设备树（最新）
          git clone --depth=1 -b 16.0 \
            https://github.com/crdroidandroid/android_device_xiaomi_lmi.git \
            device/xiaomi/lmi
          # 5b. ScribeSavant 的 TWRP 专用配置
          git clone --depth=1 -b fox-12.1 \
            https://github.com/ScribeSavant/device_xiaomi_lmi-TWRP.git /tmp/sav
          # 5c. 合并：TWRP 的 recovery 目录、product、内核、vendor 定义
          cp -r /tmp/sav/recovery device/xiaomi/lmi/
          cp /tmp/sav/twrp_lmi.mk device/xiaomi/lmi/
          cp /tmp/sav/vendorsetup.sh device/xiaomi/lmi/
          cp -r /tmp/sav/prebuilt device/xiaomi/lmi/
          cp /tmp/sav/twrp.dependencies device/xiaomi/lmi/ 2>/dev/null || true
          # 5d. product 注册（crDroid 的 AndroidProducts.mk + twrp_lmi）
          cat /tmp/sav/AndroidProducts.mk >> device/xiaomi/lmi/AndroidProducts.mk
          # 5e. TWRP 的 BoardConfig 段（TW_*、recovery 分区）
          grep -E '^(TW_|BOARD_RECOVERY|TARGET_RECOVERY|RECOVERY_)' /tmp/sav/BoardConfig.mk >> device/xiaomi/lmi/BoardConfig.mk 2>/dev/null || true
          # 5f. 验证合并结果
          echo "=== 设备树合并检查："
          for f in twrp_lmi.mk vendorsetup.sh recovery/root/init.recovery.qcom.rc prebuilt/Image.gz-dtb AndroidProducts.mk BoardConfig.mk; do
            [ -e "device/xiaomi/lmi/$f" ] && echo "  ✓ $f" || echo "  ✗ $f 缺失"
          done
          grep -c 'twrp_lmi' device/xiaomi/lmi/AndroidProducts.mk

      # ============================================================
      # 步骤 4：应用补丁（每项独立 + 断言，失败即停）
      # ============================================================
      - name: 6. 应用补丁
        run: |
          cd /home/runner/work_build
          D=device/xiaomi/lmi
          set -e
          echo "=== 6a. BoardConfig 裸引号（soong extra.variables JSON）"
          sed -i 's/^\(TARGET_RECOVERY_PIXEL_FORMAT *:*= *\)"\(.*\)"$/\1\2/' $D/BoardConfig.mk
          grep -q 'TARGET_RECOVERY_PIXEL_FORMAT := RGBX_8888' $D/BoardConfig.mk && echo "  ✓"

          echo "=== 6b. 16K 页对齐豁免（magiskboot 4K）"
          echo 'PRODUCT_CHECK_PREBUILT_MAX_PAGE_SIZE := false' >> $D/device.mk
          grep -q 'PRODUCT_CHECK_PREBUILT_MAX_PAGE_SIZE := false' $D/device.mk && echo "  ✓"

          echo "=== 6c. fox_16.0 变量改名（FOX_VERSION 废弃）"
          sed -i 's/export FOX_VERSION="R11.1_3"/export FOX_MAINTAINER_PATCH_VERSION="3"/' $D/vendorsetup.sh || true
          grep -q 'FOX_MAINTAINER_PATCH_VERSION' $D/vendorsetup.sh && echo "  ✓"

          echo "=== 6d. openaes K&R 旧 C（gnu99）"
          sed -i \
            -e 's/LOCAL_CFLAGS:= -g -c -W/LOCAL_CFLAGS:= -g -c -W -std=gnu99 -Wno-deprecated-non-prototype -Wno-error=deprecated-non-prototype/' \
            bootable/recovery/openaes/Android.mk
          grep -q 'Wno-error=deprecated-non-prototype' bootable/recovery/openaes/Android.mk && echo "  ✓"

          echo "=== 6e. libtar 过时 ndk_platform"
          sed -i 's/-ndk_platform/-ndk/g' bootable/recovery/Android.mk bootable/recovery/libtar/Android.mk || true

          echo "=== 6f. A16 API 适配（crDroid 的树已是 A16，仅确保 device.mk 继承）"
          grep -q 'twrp_lmi' $D/AndroidProducts.mk && echo "  ✓"

          echo "=== 补丁全部应用完成"

      # ============================================================
      # 步骤 5：编译
      # ============================================================
      - name: 7. 编译 Recovery
        run: |
          cd /home/runner/work_build
          export PATH=~/bin:$PATH
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_EXEC="$(command -v ccache)"
          ccache -M 7G
          ccache -o compression=true
          ccache -z

          source build/envsetup.sh
          lunch twrp_lmi-bp2a-eng || lunch twrp_lmi-eng || lunch twrp_lmi-userdebug || lunch twrp_lmi
          RC=0
          mka recoveryimage -j$(($(nproc) * 2)) || RC=$?
          ccache -s || true
          if [ "$RC" -ne 0 ]; then
            echo '===== 构建失败，dump 关键信息 ====='
            [ -f out/soong/soong.twrp_lmi.extra.variables ] && sed -n '1,45p' out/soong/soong.twrp_lmi.extra.variables
            exit "$RC"
          fi

      # ============================================================
      # 步骤 6：产物
      # ============================================================
      - name: 8. 复制并上传产物
        run: |
          cd /home/runner/work_build
          mkdir -p /home/runner/output
          cp out/target/product/lmi/recovery.img /home/runner/output/recovery.img
          ls -lh /home/runner/output/recovery.img
          file /home/runner/output/recovery.img
          md5sum /home/runner/output/recovery.img
          OUT="OrangeFox-lmi-A16-$(date +%Y%m%d%H%M).img"
          mv /home/runner/output/recovery.img "/home/runner/output/$OUT"
          echo "OUT_NAME=$OUT" >> "$GITHUB_ENV"
          echo "文件名: $OUT"

      - name: 9. 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery-lmi
          path: /home/runner/output/${{ env.OUT_NAME }}
          retention-days: 30

      - name: 10. 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lmi-recovery-${{ github.run_number }}
          name: OrangeFox Recovery for lmi (A16, crDroid tree) #${{ github.run_number }}
          body: |
            自动编译的 OrangeFox Recovery（A16）
            设备: lmi
            设备树: crDroid android-16.0 + ScribeSavant TWRP 配置
          files: /home/runner/output/${{ env.OUT_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
