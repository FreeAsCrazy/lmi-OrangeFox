name: 编译 lmi Recovery (crDroid A16 + TWRP)

on:
  workflow_dispatch:

concurrency:
  group: lmi-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      # ============ 环境 ============
      - name: 1. 释放磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: 2. 安装依赖
        run: |
          export DEBIAN_FRONTEND=noninteractive
          PKGS="git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses-dev x11proto-core-dev libx11-dev \
            libgl1-mesa-dev libxml2-utils xsltproc fontconfig python3 python3-pip \
            openjdk-17-jdk bc g++-multilib gcc-multilib libssl-dev libelf-dev ccache rsync unzip"
          sudo -E apt-get install -yq --no-install-recommends $PKGS || {
            sudo apt-get update
            sudo -E apt-get install -yq --no-install-recommends $PKGS
          }
          N=6.2-0ubuntu2.1
          curl -fsSL --retry 3 -O "http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_${N}_amd64.deb"
          curl -fsSL --retry 3 -O "http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_${N}_amd64.deb"
          sudo dpkg -i "libtinfo5_${N}_amd64.deb" "libncurses5_${N}_amd64.deb" || true
          sudo apt-get clean

      - name: 3. ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-lmi-cr-${{ github.run_id }}
          restore-keys: |
            ccache-lmi-

      # ============ 同步源码 ============
      - name: 4. repo init + sync
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          mkdir -p /home/runner/build && cd /home/runner/build
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_16.0
          repo manifest -o "$RUNNER_TEMP/manifest.xml"
          mkdir -p .repo/local_manifests
          {
            echo '<manifest>'
            for p in cts developers/build developers/samples/android \
              device/generic/arm64 device/generic/armv7-a-neon device/generic/art \
              device/generic/car device/generic/common device/generic/goldfish \
              device/generic/goldfish-opengl device/generic/trusty device/generic/x86 \
              device/generic/x86_64 device/google/atv device/google/contexthub \
              device/google/common/etm device/google/cuttlefish \
              device/google/cuttlefish_prebuilts device/google/cuttlefish_vmm \
              device/google/trout sdk test/dittosuite test/robolectric-extensions \
              test/mlts/benchmark test/mlts/models test/cts-root \
              test/mts test/suite_harness test/vts test/vts-testcase/hal \
              test/vts-testcase/kernel test/vts-testcase/nbu test/vts-testcase/performance \
              test/vts-testcase/security test/vts-testcase/vndk test/catbox; do
              grep -qE "(path|name)=\"$p\"" "$RUNNER_TEMP/manifest.xml" &&
                echo "  <remove-project path=\"$p\" />"
            done
            # OrangeFox GitLab 已 404 的项目：libarchive/libfuse3 用 AOSP 源，fox-go 跳过
            echo '  <remove-project path="external/libarchive" />'
            echo '  <remove-project path="external/libfuse3" />'
            echo '  <remove-project name="external/fox-go" />'
            echo '  <project path="external/libarchive" name="platform/external/libarchive" remote="aosp" revision="refs/tags/android-16.0.0_r1" />'
            echo '  <project path="external/libfuse3" name="platform/external/libfuse3" remote="aosp" revision="refs/tags/android-16.0.0_r1" />'
            echo '</manifest>'
          } > .repo/local_manifests/remove.xml

          success=false
          for i in 1 2 3 4 5; do
            if repo sync -c -j32 --force-sync --no-clone-bundle --no-tags --optimized-fetch --retry-fetches=10; then
              success=true; break
            fi
            echo "=== 第 $i 次 sync 失败，15 秒后重试 ==="; sleep 15
          done
          [ "$success" = true ] || exit 1
          rm -rf .repo
          rm -rf kernel/prebuilts
          echo "=== sync 完成，目录检查："
          for d in build/make build/soong bootable/recovery vendor/twrp system/vold system/core; do
            [ -d "$d" ] && echo "  ✓ $d" || echo "  ✗ $d 缺失"
          done
          df -h /

      # ============ 设备树 ============
      - name: 5. 放入设备树
        run: |
          cd /home/runner/build
          mkdir -p device/xiaomi vendor/xiaomi
          # 5a. crDroid A16 设备树（基础）
          git clone --depth=1 -b 16.0 \
            https://github.com/crdroidandroid/android_device_xiaomi_lmi.git \
            device/xiaomi/lmi
          # 5b. vendor blobs（从 Release，刷机包提取）
          curl -fsSL --retry 3 -o /tmp/vendor.tar.gz \
            "https://github.com/FreeAsCrazy/lmi-recovery/releases/download/prebuilt/vendor_xiaomi_lmi.tar.gz"
          tar -xzf /tmp/vendor.tar.gz -C vendor/
          # 5c. TWRP 配置参考树（sponmer）
          git clone --depth=1 -b fox_12.1 \
            https://github.com/Sponmer/orangefox_device_xiaomi_lmi.git /tmp/sponmer
          cp -r /tmp/sponmer/recovery device/xiaomi/lmi/
          cp /tmp/sponmer/twrp_lmi.mk device/xiaomi/lmi/
          # 5d. A16 recovery.fstab（从刷机包提取，crDroid 分区 + erofs）
          curl -fsSL --retry 3 -o device/xiaomi/lmi/recovery/root/system/etc/recovery.fstab \
            "https://raw.githubusercontent.com/FreeAsCrazy/lmi-recovery/main/prebuilt/recovery_A16.fstab"
          # 5e. A16 内核/dtbo（从刷机包提取）
          mkdir -p device/xiaomi/lmi/prebuilt
          curl -fsSL --retry 3 -o device/xiaomi/lmi/prebuilt/kernel \
            "https://github.com/FreeAsCrazy/lmi-recovery/releases/download/prebuilt/kernel"
          curl -fsSL --retry 3 -o device/xiaomi/lmi/prebuilt/dtbo.img \
            "https://github.com/FreeAsCrazy/lmi-recovery/releases/download/prebuilt/dtbo.img"
          # 5f. 删除不兼容的 vendorsetup（crDroid 旧格式 + OrangeFox manifest 自带的其他设备）
          rm -f device/xiaomi/lmi/vendorsetup.sh
          find device -name 'vendorsetup.sh' ! -path 'device/xiaomi/lmi/*' -delete 2>/dev/null || true
          # 5g. product 注册（sponmer 的 twrp_lmi）
          cat /tmp/sponmer/AndroidProducts.mk >> device/xiaomi/lmi/AndroidProducts.mk
          # 5h. TWRP 的 BoardConfig 段（sponmer 的 TW_*）
          grep -E '^(TW_|BOARD_RECOVERY|TARGET_RECOVERY|RECOVERY_)' /tmp/sponmer/BoardConfig.mk >> device/xiaomi/lmi/BoardConfig.mk 2>/dev/null || true
          # 5i. TWRP FBE 解密（参考 umi A13 树）
          echo 'BOARD_USES_QCOM_FBE_DECRYPTION := true' >> device/xiaomi/lmi/BoardConfig.mk
          echo 'TARGET_RECOVERY_DEVICE_MODULES := libinit_lmi' >> device/xiaomi/lmi/BoardConfig.mk
          # 5j. 去掉 vendor sepolicy 依赖（OrangeFox manifest 无 device/qcom/sepolicy_vndr）
          sed -i '/device\/qcom\/sepolicy_vndr\/SEPolicy.mk/d' device/xiaomi/lmi/BoardConfig.mk
          # 5k. 验证
          echo "=== 设备树检查："
          for f in twrp_lmi.mk prebuilt/kernel recovery/root/system/etc/recovery.fstab BoardConfig.mk; do
            [ -e "device/xiaomi/lmi/$f" ] && echo "  ✓ $f" || echo "  ✗ $f 缺失"
          done
          grep -c 'twrp_lmi' device/xiaomi/lmi/AndroidProducts.mk

      # ============ 编译 ============
      - name: 6. 编译
        run: |
          cd /home/runner/build
          export PATH=~/bin:$PATH
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_EXEC="$(command -v ccache)"
          ccache -M 7G || true
          ccache -z || true

          source build/envsetup.sh
          lunch twrp_lmi-eng || lunch twrp_lmi-userdebug || lunch twrp_lmi
          RC=0
          mka recoveryimage -j$(($(nproc) * 2)) || RC=$?
          ccache -s || true
          if [ "$RC" -ne 0 ]; then
            echo '===== 构建失败 ====='
            exit "$RC"
          fi

      # ============ 产物 ============
      - name: 7. 复制并上传
        run: |
          cd /home/runner/build
          mkdir -p /home/runner/output
          cp out/target/product/lmi/recovery.img /home/runner/output/recovery.img
          ls -lh /home/runner/output/recovery.img
          file /home/runner/output/recovery.img
          md5sum /home/runner/output/recovery.img
          OUT="lmi-recovery-A16-$(date +%Y%m%d%H%M).img"
          mv /home/runner/output/recovery.img "/home/runner/output/$OUT"
          echo "OUT_NAME=$OUT" >> "$GITHUB_ENV"

      - name: 8. 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery-lmi
          path: /home/runner/output/${{ env.OUT_NAME }}
          retention-days: 30

      - name: 9. Release（统一 prebuilt Release）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prebuilt
          name: lmi recovery (builds + prebuilt assets)
          body: |
            prebuilt 资源 + crDroid A16 树编译产物
          files: /home/runner/output/${{ env.OUT_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
